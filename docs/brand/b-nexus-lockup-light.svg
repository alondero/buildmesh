    <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="23.25" stroke="url(#bllEdge)" stroke-opacity=".75" stroke-width="1.5"/>
    <g filter="url(#bllGlow)" opacity=".55">
      <circle cx="30" cy="30" r="6" fill="#22d3ee"/>
      <circle cx="66" cy="30" r="6" fill="#34d399"/>
      <circle cx="48" cy="56" r="5.5" fill="#a78bfa"/>
    </g>
    <path d="M30 30 Q48 14 66 30" stroke="url(#bllEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".5"/>
    <path d="M20 72 Q48 88 76 72" stroke="url(#bllEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".3"/>
    <g stroke="url(#bllWire)" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".95">
