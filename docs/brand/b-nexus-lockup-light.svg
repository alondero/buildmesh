  <text x="118" y="61" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="33" font-weight="700" letter-spacing="-0.03em"><tspan fill="#0f172a">build</tspan><tspan fill="url(#bllText)">mesh</tspan></text>
