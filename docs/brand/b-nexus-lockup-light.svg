<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 96" width="288" height="96" fill="none" role="img" aria-labelledby="bllTitle">
  <title id="bllTitle">Buildmesh</title>
  <defs>
    <linearGradient id="bllEdge" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bllPlate" x1="48" y1="4" x2="48" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1b23"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="bllWire" x1="20" y1="74" x2="76" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset=".5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bllText" x1="190" y1="40" x2="278" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369a1"/>
