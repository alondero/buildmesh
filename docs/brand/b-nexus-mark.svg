<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-labelledby="bmTitle">
  <title id="bmTitle">Buildmesh mark — Nexus</title>
  <defs>
    <linearGradient id="bmEdge" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bmPlate" x1="48" y1="4" x2="48" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1b23"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="bmWire" x1="20" y1="74" x2="76" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="bmGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Plate -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#bmPlate)"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="23.25" stroke="url(#bmEdge)" stroke-opacity=".55" stroke-width="1.5"/>

  <!-- Node bloom -->
  <g filter="url(#bmGlow)" opacity=".65">
    <circle cx="30" cy="30" r="6" fill="#22d3ee"/>
    <circle cx="66" cy="30" r="6" fill="#34d399"/>
    <circle cx="48" cy="56" r="5.5" fill="#8b5cf6"/>
  </g>

  <!-- Mesh closure arcs -->
  <path d="M30 30 Q48 14 66 30" stroke="url(#bmEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".4"/>
  <path d="M20 72 Q48 88 76 72" stroke="url(#bmEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".22"/>

  <!-- Wires -->
  <g stroke="url(#bmWire)" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".95">
    <path d="M20 72 L30 30"/>
    <path d="M30 30 L48 56"/>
    <path d="M48 56 L66 30"/>
    <path d="M66 30 L76 72"/>
  </g>

  <!-- Nodes -->
  <circle cx="30" cy="30" r="5" fill="#22d3ee"/>
  <circle cx="66" cy="30" r="5" fill="#34d399"/>
  <circle cx="48" cy="56" r="4.5" fill="#8b5cf6"/>
  <circle cx="20" cy="72" r="3.5" fill="#0ea5e9"/>
  <circle cx="76" cy="72" r="3.5" fill="#22c55e"/>
</svg>
