<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-labelledby="amTitle">
  <title id="amTitle">Buildmesh mark — Lattice</title>
  <defs>
    <linearGradient id="amMesh" x1="12" y1="50" x2="84" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".42" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="amVeil" x1="30" y1="18" x2="66" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#34d399" stop-opacity=".5"/>
    </linearGradient>
    <filter id="amBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- Rear weave: the deeper second M that gives the lattice its depth -->
  <path d="M30 18 L48 86 L66 18" stroke="url(#amVeil)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brand bloom, then the crisp front M on top -->
  <path d="M12 80 L30 18 L48 52 L66 18 L84 80" stroke="url(#amMesh)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".5" filter="url(#amBloom)"/>
  <path d="M12 80 L30 18 L48 52 L66 18 L84 80" stroke="url(#amMesh)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodes -->
  <circle cx="30" cy="18" r="6" fill="#22d3ee"/>
  <circle cx="66" cy="18" r="6" fill="#34d399"/>
  <circle cx="48" cy="52" r="4.2" fill="#8b5cf6"/>
  <circle cx="12" cy="80" r="4" fill="#00d4ff"/>
  <circle cx="84" cy="80" r="4" fill="#22c55e"/>
</svg>
