      <circle cx="66" cy="30" r="6" fill="#34d399"/>
      <circle cx="48" cy="56" r="5.5" fill="#8b5cf6"/>
    </g>
    <path d="M30 30 Q48 14 66 30" stroke="url(#blEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".4"/>
    <path d="M20 72 Q48 88 76 72" stroke="url(#blEdge)" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".22"/>
    <g stroke="url(#blWire)" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".95">
      <path d="M20 72 L30 30"/>
      <path d="M30 30 L48 56"/>
      <path d="M48 56 L66 30"/>
