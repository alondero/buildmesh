<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 96" width="288" height="96" fill="none" role="img" aria-labelledby="blTitle">
  <title id="blTitle">Buildmesh</title>
  <defs>
    <linearGradient id="blEdge" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="blPlate" x1="48" y1="4" x2="48" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1b23"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="blWire" x1="20" y1="74" x2="76" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="blText" x1="190" y1="40" x2="278" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
