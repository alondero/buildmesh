  <text x="118" y="61" font-family="Geist, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="33" font-weight="700" letter-spacing="-0.03em"><tspan fill="#e2e8f0">build</tspan><tspan fill="url(#blText)">mesh</tspan></text>
