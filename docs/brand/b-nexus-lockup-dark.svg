  <g>
    <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#blPlate)"/>
    <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="23.25" stroke="url(#blEdge)" stroke-opacity=".55" stroke-width="1.5"/>
    <g filter="url(#blGlow)" opacity=".65">
