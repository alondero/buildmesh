[package]
name = "buildmesh"
version = "1.5.0-0"
description = "AI Agent Orchestration Hub for Windows + WSL"
authors = ["Adam Londero <alondero@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "buildmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test and crash-diagnosis IPC commands (`create_test_mesh`,
# `debug_list_agents`, `debug_crash_snapshot`) are gated behind
# `#[cfg(any(debug_assertions, feature = "dev-tools"))]` so a shipped release
# window never answers those names (issue #2153). The loopback HTTP test
# bridge uses the same cfg, and it binds only when `BUILDMESH_TEST_BRIDGE=1`
# and a per-launch token are set. `debug_assertions` covers `cargo build` and
# `tauri dev`; the dev profile is built by `tauri build` (release mode, see
# scripts/run-dev.ps1), so it opts in with this feature via
# `npm run tauri:build:dev`. Default-off: the release build does not pass it.
dev-tools = []

[dependencies]
# `#[blocking_command]` proc-macro attribute — wraps async Tauri command
# bodies in `crate::commands::run_blocking(label, move || { ... }).await`
# so we don't hand-write the offload boilerplate across 30+ commands
# (issue #1380 review point 3). Path dep — the crate lives in this
# workspace alongside `buildmesh_lib`.
buildmesh_macros = { path = "proc-macros" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
notify = "8"
difference-rs = "3.2"
syntect = "5"
portable-pty = "0.9"
# Needed to implement portable-pty's `MasterPty` trait, whose methods return
# `anyhow::Error` (already in the dep tree via portable-pty); used by the
# Windows AppContainer ConPTY spawn (sandbox::conpty, #498).
anyhow = "1"
git2 = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.10"
backtrace = "0.3"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sha2 = "0.11"
base64 = "0.23"
tiny_http = "0.12"
tokio-tungstenite = "0.30"
futures-util = "0.3"
# Opt-in LAN exposure & self-signed TLS (issue #501). Reqwest uses
# `rustls-no-provider` to keep the tree on `ring` rather than pulling in a
# second crypto implementation. The shared HTTP client helper and `run()`
# install it before client construction; the server selects it explicitly.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Self-signed certificate generation for the LAN/VPN HTTPS path. `ring` backend
# (not the default aws_lc_rs) to match the rest of the tree and avoid a second
# crypto crate.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Issue #713: temporary working dir for the `openssl cms -sign` shell-out
# (the unsigned plist + signer cert/key PEMs land here, the signed blob is
# read out, the tempdir drops on scope exit). Auto-removed on drop; the
# operation runs once per modal open so the I/O cost is negligible.
tempfile = "3"
toml_edit = "0.25.12"
parking_lot = "0.12"
# PATH + PATHEXT-aware lookup for `session_naming::resolve_claude_binary`.
# See session_naming.rs for the rationale (PATH-stale buildmesh process
# can't find `claude.exe` via plain `Command::new("claude")`).
which = "8"
# Non-Windows LAN/VPN enumeration (issue #501). Windows uses `GetAdaptersAddresses`
# directly via `http::interface_rank::windows_impl` (inline FFI, no `windows-sys`
# dep — matches `sandbox::restricted_token`'s convention); this crate is only
# consulted on macOS/Linux and via the non-Windows branch of
# `http::interface_rank::enumerate_with_classes`. Windows ranks gatewayed NICs
# above idle tunnels; non-Windows ranks by RFC-1918 range heuristic (single
# syscall, no Windows GetAdaptersAddresses call). See issue #630.
local-ip-address = "0.6"
# `subtle` is already in the dep tree via `rustls` (issue #1240). Used directly
# for constant-time credential comparison — its `ConstantTimeEq` impl uses
# compiler-fence barriers (`core::hint::black_box`, volatile reads) so the
# inner loop cannot be optimised into a short-circuit under our
# `lto = "thin"` release profile, which a hand-rolled byte XOR loop can be.
subtle = "2"

# `shell-words` is already in the dep tree (transitively via `clap`
# and friends) — issue #1362 code review pinned it as a direct dep so
# `AgentProvider::extra_args_args` quote-aware tokenisation isn't
# silently upgraded if a future Cargo update removes the transitive
# path. Same cost-of-declaring lesson as issue #1240 with `subtle`.
shell-words = "1"

# OS-level interface-change notifications for issue #591.
# Windows: `NotifyAddrChange` from Iphlpapi.dll. The crate is already in the
# tree transitively via `rustix`/`signal-hook`; pinning to 0.61 keeps the
# `windows-sys` versions aligned. macOS/Linux use a polling fallback (no new
# deps) — see `http::interface_watcher`.
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "form", "query", "charset", "http2", "system-proxy", "rustls-no-provider"] }
rust-embed = "8"
# Shared Rust→TS type generation (issue #359). `#[derive(TS)]` on wire structs
# emits .ts files into ../src/types/generated/ via `cargo test`; a CI gate
# (`git diff --exit-code`) then fails on drift. chrono-impl maps DateTime<Utc>
# to `string`; serde-compat (default) honours #[serde(rename_all = ...)].
ts-rs = { version = "12", features = ["chrono-impl"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `Win32_NetworkManagement_IpHelper` backs `http::interface_rank`; the rest back
# `windowing::snap_overlay`, the native child HWND that makes Windows 11 offer
# Snap Layouts to our frameless window (ADR-0035). Each maps to one need there:
# creating and positioning the window (Gdi, LibraryLoader,
# WindowsAndMessaging), scaling it for the monitor DPI (HiDpi), learning that
# the pointer left it (Input_KeyboardAndMouse), and hooking the parent's
# message stream so it stays pinned during a resize (Shell, for
# `SetWindowSubclass`). `System_Threading` + `Security` are the named mutex
# behind `instance_guard`'s one-process-per-profile claim: `CreateMutexW` is
# gated on `Security` in windows-sys because of its SECURITY_ATTRIBUTES
# parameter, which we pass as null. `System_Memory` + `System_DataExchange`
# back `startup::present`'s "Copy details" button on the fatal-startup error
# surface (issue #1525): `GlobalAlloc`/`GlobalLock`/`GlobalUnlock` stage the
# UTF-16 text, `OpenClipboard`/`EmptyClipboard`/`SetClipboardData` own the
# transfer, and `GlobalFree` (already covered by `Foundation`) reclaims the
# block on every failure path. That surface cannot use a Tauri command or the
# dialog plugin — it runs inside `setup`, before the event loop has started
# and before the database exists, which is the whole reason it exists.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# In-app auto-update (issue #826). Desktop-only: the updater downloads &
# verifies a signed release package (its own minisign signature, independent
# of OS code signing); `process` provides `relaunch()` after install.
#
# `default-features = false` drops the plugin's `zip` feature, the only path
# that pulls the `zip` crate into the graph. It stays off because the crate is
# not fixable at any version we could adopt (see below), and nothing Buildmesh
# ships needs it:
#
#   * Windows is the only platform with a published updater feed, and no key in
#     that feed resolves to a ZIP: every key maps to an `.msi` or an `.exe`, and
#     both go through `extract_exe`, which never opens an archive. The zip path
#     is therefore unreachable whichever key the updater settles on. The
#     platform-to-asset mapping this was checked against is recorded in
#     docs/archive/2026-10/rustsec-zip-extraction-2026-10.md — re-read the
#     published feed before relying on this, since a new key pointing at a real
#     `.zip` artifact would make the feature needed again.
#   * The feature also gates Linux AppImage `.tar.gz` extraction, and there is
#     no Linux release or AppImage artifact. Re-enabling the feature is the
#     first step if that ever changes.
#
# Re-enabling this feature reintroduces RUSTSEC-2026-0367/0368/0369 (insecure
# ZIP extraction). No version to upgrade to is available instead, because the
# plugin pins `zip = "4"` and the advisories are fixed only in 9.x; both halves
# of that are upstream state that can change without a commit here, so
# docs/development/supply-chain.md#when-no-fixed-release-exists carries the rule
# and the same archive entry carries the dated check. Keep this feature off
# (issue #2438).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"

[dev-dependencies]
# Empty — `tempfile` was promoted to a regular dependency for issue #713
# (`mobileconfig::sign_mobileconfig`). Kept as a section header for
# diff-hygiene against future `cargo add --dev` calls.

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 0
