[package]
name = "buildmesh"
version = "1.0.0"
description = "AI Agent Orchestration Hub for Windows + WSL"
authors = ["Adam Londero <alondero@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "buildmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
notify = "8"
difference-rs = "3.2"
syntect = "5"
portable-pty = "0.8"
# Needed to implement portable-pty's `MasterPty` trait, whose methods return
# `anyhow::Error` (already in the dep tree via portable-pty); used by the
# Windows AppContainer ConPTY spawn (sandbox::conpty, #498).
anyhow = "1"
git2 = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.9"
backtrace = "0.3"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
tiny_http = "0.12"
tokio-tungstenite = "0.26"
futures-util = "0.3"
# Opt-in LAN exposure & self-signed TLS (issue #501). `rustls`/`tokio-rustls`/
# `ring` already ride in via reqwest's `hyper-rustls`, but with no crypto
# provider compiled in (the tree has no aws-lc-rs). We enable the `ring`
# provider explicitly — both here and in `http::tls`'s `builder_with_provider`
# — so the embedded server's TLS never depends on a process-default provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Self-signed certificate generation for the LAN/VPN HTTPS path. `ring` backend
# (not the default aws_lc_rs) to match the rest of the tree and avoid a second
# crypto crate.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
parking_lot = "0.12"
# Non-Windows LAN/VPN enumeration (issue #501). Windows uses `GetAdaptersAddresses`
# directly via `http::interface_rank::windows_impl` (inline FFI, no `windows-sys`
# dep — matches `sandbox::restricted_token`'s convention); this crate is only
# consulted on macOS/Linux and via the non-Windows branch of
# `http::interface_rank::enumerate_with_classes`. Windows ranks gatewayed NICs
# above idle tunnels; non-Windows ranks by RFC-1918 range heuristic (single
# syscall, no Windows GetAdaptersAddresses call). See issue #630.
local-ip-address = "0.6"

# OS-level interface-change notifications for issue #591.
# Windows: `NotifyAddrChange` from Iphlpapi.dll. The crate is already in the
# tree transitively via `rustix`/`signal-hook`; pinning to 0.61 keeps the
# `windows-sys` versions aligned. macOS/Linux use a polling fallback (no new
# deps) — see `http::interface_watcher`.
reqwest = { version = "0.12", features = ["json", "blocking"] }
rust-embed = "8"
# Shared Rust→TS type generation (issue #359). `#[derive(TS)]` on wire structs
# emits .ts files into ../src/types/generated/ via `cargo test`; a CI gate
# (`git diff --exit-code`) then fails on drift. chrono-impl maps DateTime<Utc>
# to `string`; serde-compat (default) honours #[serde(rename_all = ...)].
ts-rs = { version = "12", features = ["chrono-impl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# In-app auto-update (issue #826). Desktop-only: the updater downloads &
# verifies a signed release package (its own minisign signature, independent
# of OS code signing); `process` provides `relaunch()` after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 0
