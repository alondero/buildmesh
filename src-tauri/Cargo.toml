[package]
name = "buildmesh"
version = "0.1.0"
description = "AI Agent Orchestration Hub for Windows + WSL"
authors = ["alond"]
edition = "2021"

[lib]
name = "buildmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
notify = "8"
difference-rs = "3.2"
syntect = "5"
portable-pty = "0.8"
git2 = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.9"
backtrace = "0.3"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
tiny_http = "0.12"
tokio-tungstenite = "0.26"
futures-util = "0.3"
parking_lot = "0.12"
local-ip-address = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
panic = "abort"

[profile.dev]
opt-level = 0

[profile.dev.release]
opt-level = 2
lto = "thin"
