<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Probe header rail — tool-switching prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-base: #0a0a0e;
    --bg-surface: #111116;
    --bg-overlay: #15151c;
    --bg-card: #16161d;
    --bg-card-hover: #1b1b23;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #7a8492;
    --accent-cyan: #00d4ff;
    --accent-cyan-dim: rgba(0, 212, 255, 0.15);
    --accent-cyan-glow: rgba(0, 212, 255, 0.08);
    --border-subtle: rgba(255, 255, 255, 0.05);
    --border-default: rgba(255, 255, 255, 0.07);
    --border-strong: rgba(255, 255, 255, 0.14);
    --ok: #22c55e; --warn: #f59e0b; --err: #ef4444; --run: #00d4ff;
    --radius-md: 4px; --radius-lg: 6px;
    --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 150ms;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    min-height: 100vh;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  :focus-visible { outline: none; box-shadow: 0 0 0 1.5px var(--accent-cyan); border-radius: var(--radius-md); }
  .ic { width: 16px; height: 16px; flex: none; display: block; }

  /* ── Reviewer console ─────────────────────────────────────────── */
  .console {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border-default);
    background: var(--bg-surface);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .console-main { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.01em; white-space: nowrap; }
  .proto-pill {
    font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent-violet, #8b5cf6); border: 1px solid rgba(139, 92, 246, 0.4);
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .variant-switch {
    display: flex; gap: 2px; padding: 2px;
    background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg);
  }
  .variant-switch button {
    padding: 5px 12px; border-radius: var(--radius-md);
    color: var(--text-secondary); font-weight: 500; font-size: 12px;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    white-space: nowrap;
  }
  .variant-switch button:hover { color: var(--text-primary); background: var(--bg-card-hover); }
  .variant-switch button[aria-checked="true"] {
    background: var(--accent-cyan-dim); color: var(--accent-cyan);
  }
  .console-sub { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; color: var(--text-secondary); font-size: 12px; }
  .slider-label { display: flex; align-items: center; gap: 8px; }
  .slider-label output { color: var(--text-primary); font-variant-numeric: tabular-nums; min-width: 44px; }
  input[type="range"] { accent-color: var(--accent-cyan); width: 180px; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { accent-color: var(--accent-cyan); }
  .hint { margin-left: auto; color: var(--text-muted); font-size: 11px; }

  /* ── Stage: mock workspace + probe dock ───────────────────────── */
  .stage {
    display: flex; gap: 0; height: 560px; padding: 24px 20px 0;
    max-width: 1180px; margin: 0 auto;
  }
  .workspace {
    flex: 1; min-width: 0; display: flex; gap: 12px; padding-right: 0;
    align-items: stretch; opacity: 0.9;
  }
  .node-card {
    flex: 1; min-width: 0; background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .node-head { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-secondary); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.run { background: var(--run); } .dot.ok { background: var(--ok); } .dot.idle { background: #4a5568; }
  .node-name { color: var(--text-primary); font-weight: 500; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.05); }
  .bar.short { width: 55%; } .bar.mid { width: 78%; } .bar.long { width: 90%; }

  .probe {
    position: relative;
    height: 100%;
    flex: none;
    display: flex; flex-direction: column;
    background: var(--bg-surface);
    border-left: 1px solid var(--border-subtle);
    border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    overflow: hidden;
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
  }

  /* ── Probe header ─────────────────────────────────────────────── */
  .p-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 12px; min-height: 56px;
    border-bottom: 1px solid var(--border-subtle);
    flex: none; user-select: none;
  }
  .p-titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .p-title { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .p-subject { display: flex; gap: 4px; font-size: 12px; color: var(--text-secondary); min-width: 0; }
  .p-subject .d { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-mode { font-size: 10px; color: rgba(122, 132, 146, 0.8); }
  .chip {
    width: 28px; height: 28px; border-radius: var(--radius-lg);
    background: var(--accent-cyan-dim); color: var(--accent-cyan);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .hub-trigger {
    display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1;
    padding: 4px 6px 4px 4px; margin-left: -4px; border-radius: var(--radius-lg);
    transition: background var(--dur) var(--ease);
    text-align: left;
  }
  .hub-trigger:hover { background: var(--bg-card-hover); }
  .hub-trigger .chev { color: var(--text-muted); flex: none; }
  .hub-trigger[aria-expanded="true"] { background: var(--bg-card-hover); }
  .icon-btn {
    width: 28px; height: 28px; border-radius: var(--radius-lg); flex: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .icon-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }

  /* ── Rail rows (variants A / B / C) ───────────────────────────── */
  .rail-row { border-bottom: 1px solid var(--border-subtle); flex: none; position: relative; user-select: none; }
  .rail-scroll { display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .rail-scroll::-webkit-scrollbar { display: none; }
  .fade-wrap { position: relative; }
  .fade-wrap::before, .fade-wrap::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 22px;
    pointer-events: none; opacity: 0; transition: opacity var(--dur) var(--ease); z-index: 1;
  }
  .fade-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg-surface), transparent); }
  .fade-wrap::after { right: 0; background: linear-gradient(-90deg, var(--bg-surface), transparent); }
  .fade-wrap.has-left::before { opacity: 1; }
  .fade-wrap.has-right::after { opacity: 1; }

  .rail-btn {
    height: 34px; flex: none; border-radius: var(--radius-lg);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .rail-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .rail-btn[aria-pressed="true"] { color: var(--accent-cyan); background: var(--accent-cyan-glow); }
  .rail-btn[aria-pressed="true"]::after {
    content: ''; position: absolute; left: 6px; right: 6px; bottom: 0; height: 2px;
    border-radius: 2px 2px 0 0; background: var(--accent-cyan);
  }
  .rail-a .rail-btn { width: 30px; }
  .rail-a .rail-scroll { padding: 3px 6px; }

  .pill { height: 26px; padding: 0 10px 0 8px; gap: 6px; border-radius: 999px; }
  .pill .p-label { font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pill .ic { width: 13px; height: 13px; }
  .pill[aria-pressed="true"] { background: var(--accent-cyan-dim); }
  .pill[aria-pressed="true"]::after { display: none; }
  .rail-b .rail-scroll { padding: 5px 8px; gap: 4px; }
  .rail-b .rail-btn { color: var(--text-secondary); }
  .rail-b .rail-btn:hover { color: var(--text-primary); }
  .rail-b .rail-btn[aria-pressed="true"] { color: var(--accent-cyan); }

  .rail-c { display: flex; align-items: center; gap: 2px; padding: 4px 6px; }
  .c-tab {
    height: 28px; padding: 0 9px; gap: 6px; border-radius: var(--radius-lg);
    color: var(--text-secondary); font-size: 12px; font-weight: 500; flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; justify-content: center; position: relative;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .c-tab .c-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-tab .ic { width: 14px; height: 14px; }
  .c-tab:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .c-tab[aria-pressed="true"] { background: var(--bg-card); color: var(--text-primary); }
  .c-tab[aria-pressed="true"]::after {
    content: ''; position: absolute; left: 8px; right: 8px; bottom: -4px; height: 2px;
    border-radius: 2px; background: var(--accent-cyan);
  }
  .c-more { width: 28px; height: 28px; flex: none; border-radius: var(--radius-lg); color: var(--text-muted); }
  .c-more:hover { background: var(--bg-card-hover); color: var(--text-primary); }
  .c-more[aria-expanded="true"] { background: var(--bg-card-hover); color: var(--text-primary); }
  .c-tools { color: var(--text-muted); border: 1px solid var(--border-default); }
  .c-tools:hover { color: var(--text-primary); background: var(--bg-card-hover); }
  .aff-wrap { align-items: center; gap: 8px; }
  .mini-switch { display: inline-flex; gap: 2px; padding: 2px; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  .mini-switch button { padding: 3px 9px; font-size: 11px; border-radius: var(--radius-md); color: var(--text-secondary); white-space: nowrap; }
  .mini-switch button:hover { color: var(--text-primary); background: var(--bg-card-hover); }
  .mini-switch button[aria-checked="true"] { background: var(--accent-cyan-dim); color: var(--accent-cyan); }
  .probe[data-narrow="true"] .c-tab .c-label { display: none; }
  .probe[data-narrow="true"] .c-tab { flex: 0 0 30px; padding: 0; }

  /* ── Tool menu (variants C + D) ───────────────────────────────── */
  .tool-menu {
    position: absolute; left: 8px; right: 8px; z-index: 20;
    background: var(--bg-overlay); border: 1px solid var(--border-default);
    border-radius: 8px; box-shadow: var(--shadow-md);
    padding: 8px; max-height: 340px; overflow-y: auto;
    animation: pop 120ms var(--ease) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .tm-group + .tm-group { margin-top: 8px; }
  .tm-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .tm-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
  .tm-scope { margin-left: auto; font-size: 10px; color: var(--text-muted); }
  .tm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tm-tile {
    display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px;
    border-radius: var(--radius-lg); text-align: left; border: 1px solid transparent;
    transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .tm-tile:hover { background: var(--bg-card-hover); }
  .tm-tile.active { border-color: rgba(0, 212, 255, 0.25); background: var(--accent-cyan-glow); }
  .tm-tile .ic { margin-top: 1px; color: var(--text-secondary); }
  .tm-tile.active .ic { color: var(--accent-cyan); }
  .tm-t-name { font-size: 12px; font-weight: 500; color: var(--text-primary); display: flex; gap: 6px; align-items: center; }
  .tm-t-desc { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .tm-recent { display: flex; gap: 4px; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border-subtle); }
  .tm-recent .r-chip {
    display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px;
    border-radius: 999px; background: var(--bg-card); color: var(--text-secondary); font-size: 11px;
    border: 1px solid var(--border-subtle);
  }
  .tm-recent .r-chip:hover { color: var(--text-primary); background: var(--bg-card-hover); }
  .tm-recent .r-chip .ic { width: 12px; height: 12px; }
  .tm-recent-label { font-size: 10px; color: var(--text-muted); align-self: center; padding-right: 2px; }

  /* ── Probe body ───────────────────────────────────────────────── */
  .p-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px 14px; }
  .body-head { display: flex; align-items: baseline; gap: 6px; padding: 2px 4px 8px; }
  .body-title { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; color: var(--text-secondary); }
  .body-count { font-size: 10px; color: var(--text-muted); }
  .row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 8px; border-radius: var(--radius-md);
    transition: background var(--dur) var(--ease);
  }
  .row:hover { background: var(--bg-card); }
  .row-main { flex: 1; min-width: 0; color: var(--text-primary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main .file { color: var(--text-primary); }
  .row-meta { flex: none; font-size: 11px; font-variant-numeric: tabular-nums; }
  .tone-dim { color: var(--text-muted); } .tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); }
  .tone-err { color: var(--err); } .tone-run { color: var(--run); }
  .note-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    padding: 12px 14px; font-size: 12px; line-height: 1.55; color: var(--text-secondary);
    white-space: pre-wrap;
  }

  /* ── Notes card ───────────────────────────────────────────────── */
  .notes { max-width: 1180px; margin: 18px auto 40px; padding: 0 20px; }
  .notes-card {
    background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px;
    padding: 16px 18px;
  }
  .notes h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .notes .nv { color: var(--accent-cyan); font-weight: 600; }
  .notes p { margin: 0 0 10px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.6; }
  .notes ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
  .notes li { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); }
  .notes .k { flex: none; width: 86px; color: var(--text-muted); font-size: 11px; padding-top: 1px; }
  .notes .k b { color: var(--text-secondary); font-weight: 600; }
  .notes .verdict { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); font-size: 12.5px; color: var(--text-primary); }
  .notes .verdict .lead { color: var(--accent-cyan); font-weight: 600; }
</style>
</head>
<body>

<header class="console">
  <div class="console-main">
    <div class="brand">
      <span class="proto-pill">Prototype</span>
      <h1>Probe panel — header tool rail for quick switching</h1>
    </div>
    <div class="variant-switch" role="radiogroup" aria-label="Prototype variant" id="variantSwitch">
      <button role="radio" data-variant="a">A · Icon rail</button>
      <button role="radio" data-variant="b">B · Pill scroller</button>
      <button role="radio" data-variant="c">C · Working-set tabs</button>
      <button role="radio" data-variant="d">D · Hub dropdown</button>
    </div>
  </div>
  <div class="console-sub">
    <label class="slider-label">Panel width
      <input type="range" id="widthSlider" min="240" max="720" step="8" value="360" />
      <output id="widthVal">360px</output>
    </label>
    <label class="check"><input type="checkbox" id="futureToggle" /> Future: merged destinations (8) — #1457–60</label>
    <span class="aff-wrap" id="affWrap" style="display:none"></span>
    <span class="hint">← → switches tools inside rails · Esc closes menus · drag width to 240px to test narrow</span>
  </div>
</header>

<main class="stage">
  <div class="workspace" aria-hidden="true">
    <div class="node-card">
      <div class="node-head"><span class="dot run"></span><span class="node-name">node-a</span><span>claude · running</span></div>
      <div class="bar long"></div><div class="bar mid"></div><div class="bar short"></div>
    </div>
    <div class="node-card">
      <div class="node-head"><span class="dot ok"></span><span class="node-name">node-b</span><span>codex · ready</span></div>
      <div class="bar mid"></div><div class="bar short"></div>
    </div>
    <div class="node-card">
      <div class="node-head"><span class="dot idle"></span><span class="node-name">node-c</span><span>terminal · idle</span></div>
      <div class="bar long"></div>
    </div>
  </div>
  <section class="probe" id="probe" style="width:360px" aria-label="Probe panel (prototype)"></section>
</main>

<aside class="notes">
  <div class="notes-card" id="notesCard"></div>
</aside>

<script>
'use strict';

const ICONS = {

function render() {
  state.active = normalizeTab(state.active);

  const activeBtn = probe.querySelector('[data-tab="' + state.active + '"]');
  if (activeBtn && activeBtn.scrollIntoView) activeBtn.scrollIntoView({ block: 'nearest', inline: 'nearest' });

function positionMenu() {
  const menu = document.getElementById('toolMenu');
  if (!menu) return;
  const anchor = document.getElementById(menu.dataset.anchor);
  const pr = probe.getBoundingClientRect();
  const ar = anchor.getBoundingClientRect();
  menu.style.top = (ar.bottom - pr.top + 4) + 'px';
}

function updateFades() {
  const wrap = probe.querySelector('.fade-wrap');
  if (!wrap) return;
  const sc = wrap.querySelector('.rail-scroll');
  if (!sc) return;
  wrap.classList.toggle('has-left', sc.scrollLeft > 2);
  wrap.classList.toggle('has-right', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2);
  sc.addEventListener('scroll', updateFades, { passive: true });
}

function selectTab(tab, opts) {
  const options = opts || {};
  state.active = tab;
  if (state.variant === 'c' || state.variant === 'd') {
    state.mru = [tab, ...state.mru.filter((t) => t !== tab)].slice(0, 4);
  }
  state.menuOpen = false;
  render();
  if (options.focus) {
    const btn = probe.querySelector('[data-tab="' + tab + '"]');
    if (btn) btn.focus();
  }
}

function moveSelection(dir) {
  const tabs = order();
  const i = tabs.indexOf(state.active);
  const next = Math.max(0, Math.min(tabs.length - 1, i + dir));
  selectTab(tabs[next], { focus: true });
}

function menuMove(dir) {
  const items = [...probe.querySelectorAll('#toolMenu .tm-tile')];
  if (!items.length) return;
  const current = items.findIndex((el) => el.getAttribute('aria-checked') === 'true');
  let next = current;
  if (dir === 'start') next = 0;
  else if (dir === 'end') next = items.length - 1;
  else if (dir === 'down') next = Math.min(items.length - 1, (current < 0 ? -2 : current) + 2);
  else if (dir === 'up') next = Math.max(0, (current < 0 ? 1 : current) - 2);
  else if (dir === 'right') next = Math.min(items.length - 1, current + 1);
  else if (dir === 'left') next = Math.max(0, current - 1);
  items.forEach((el, i) => el.setAttribute('tabindex', i === next ? '0' : '-1'));
  items[next].focus();
}

function toggleMenu(open) {
  state.menuOpen = open === undefined ? !state.menuOpen : open;
  render();
  if (state.menuOpen) {
    const first = probe.querySelector('#toolMenu .tm-tile[aria-checked="true"], #toolMenu .tm-tile');
    if (first) first.focus();
  } else {
    const trigger = document.getElementById(state.variant === 'd' ? 'hubTrigger' : 'cPlus');
    if (trigger) trigger.focus();
  }
}

probe.addEventListener('click', (e) => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { selectTab(tabBtn.dataset.tab, { focus: state.menuOpen }); return; }
  const hub = e.target.closest('#hubTrigger');
  if (hub) { toggleMenu(); return; }
  const plus = e.target.closest('#cPlus');
  if (plus) { toggleMenu(); return; }
  if (!e.target.closest('#toolMenu')) state.menuOpen = false;
});

probe.addEventListener('keydown', (e) => {
  const menu = document.getElementById('toolMenu');
  if (menu) {
    if (e.key === 'Escape') { e.preventDefault(); toggleMenu(false); return; }
    if (e.target.closest('#toolMenu')) {
      const dirs = { ArrowDown: 'down', ArrowUp: 'up', ArrowLeft: 'left', ArrowRight: 'right', Home: 'start', End: 'end' };
      if (dirs[e.key]) { e.preventDefault(); menuMove(dirs[e.key]); return; }
      return;
    }
  }
  const railKeydown = state.variant !== 'd' && e.target.closest('#railRow');
  if (railKeydown) {
    if (e.key === 'ArrowRight') { e.preventDefault(); moveSelection(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveSelection(-1); }
    else if (e.key === 'Home') { e.preventDefault(); selectTab(order()[0], { focus: true }); }
    else if (e.key === 'End') { e.preventDefault(); selectTab(order()[order().length - 1], { focus: true }); }
  }
});

document.addEventListener('mousedown', (e) => {
  if (state.menuOpen && !e.target.closest('#toolMenu') && !e.target.closest('#hubTrigger') && !e.target.closest('#cPlus')) {
    state.menuOpen = false;
    render();
  }
});

    btn.setAttribute('aria-checked', btn.dataset.aff === state.affordance ? 'true' : 'false');
  });
}

/* ── Trade-off notes per variant ─────────────────────────────── */
const NOTES = {
  a: {
    name: 'A · Icon rail',
    pitch: 'All eleven destinations as icon buttons in one 36px strip under the header. One click reaches any tool.',
    axes: [
      ['Space', '<b>+36px</b> height, zero width cost while the panel is closed (renders only when open).'],
      ['Friction', '<b>1 click</b> to any tool — the fastest pattern here, but you pay in icon recall (tooltips + learned positions).'],
      ['Clutter', 'Low — icons only, quiet until hovered, active tool underlined in cyan.'],
      ['Narrow 240px', '11 icons overflow → horizontal scroll with edge fades (8 destinations after #1457–60 fit).'],
    ],
    verdict: 'Best for frequent switchers. Directly answers ADR-0030’s width objection; weakest on its “icon-only confusion” objection.',
  },
  b: {
    name: 'B · Pill scroller',
    pitch: 'Icon + label pills, horizontally scrollable. Nothing to memorise — every tool is named.',
    axes: [
      ['Space', '<b>+34px</b> height, but labels make it the widest pattern — at 360px roughly half the tools are off-screen.'],
      ['Friction', '<b>1 click</b>, zero recall — the most discoverable option.'],
      ['Clutter', 'Highest — 11 competing labels sit between you and the content.'],
      ['Narrow 240px', 'Only ~2 pills visible; scrolling becomes the main interaction.'],
    ],
    verdict: 'Great for discovery, likely tiring daily. Use if labels matter more than density.',
  },
  c: {
    name: 'C · Working-set tabs',
    pitch: 'Tabs appear only for destinations you open this session (most-recent, max 4); “+” opens the grouped tool grid from the omnibar.',
    axes: [
      ['Space', '<b>0px on open, +34px once working</b> — chrome scales with what you actually use, not the full 11.'],
      ['Friction', '<b>1 click</b> within your working set, 2 clicks for cold destinations.'],
      ['Clutter', 'Low — typically 2–4 tabs; collapses to icons below 320px.'],
      ['Narrow 240px', 'Icon-only tabs fit comfortably.'],
    ],
    verdict: 'The editor-tabs mental model. Balanced on all three axes; MRU eviction may want favourites-pinning later.',

    pitch: 'The header’s icon chip + label become a menu showing Recent chips plus the grouped tool grid — the omnibar’s language, inline.',

      ['Friction', 'Every switch is <b>open + pick</b>; the Recent row softens repeats to effectively 1 click for your top tools.'],

};

const AFF_NOTES = {
  chevron: 'Chevron (⌄): quietest option — the standard “menu below” idiom, but on its own it says “dropdown”, not “all tools”.',
  ellipsis: 'More (⋯): the classic tab-strip overflow glyph (“more of these”), though elsewhere it often means “more actions”.',
  grid: 'Tool grid (⊞): app-launcher language — the established “browse all apps/tools” glyph, and it echoes the omnibar’s tool grid. Same 28px footprint the “+” had.',
  label: '“Tools” tab: self-documenting — zero ambiguity, reads as an action thanks to its outlined ghost style. Costs ~64px of row width; collapses to its icon at narrow widths like the other tabs.',
  header: 'In header: keeps the tab row purely a working set and files “all tools” with the panel-level actions (Pin, Close) — semantically cleanest split, but the action is detached from the tabs it browses.',
};

function renderNotes() {
  const n = NOTES[state.variant];
  const pitch = state.variant === 'c' ? `${n.pitch} ${AFF_NOTES[state.affordance]}` : n.pitch;
  notesCard.innerHTML = `
    <h2><span class="nv">${n.name}</span></h2>
    <p>${pitch}</p>
    <ul>${n.axes.map(([k, v]) => `<li><span class="k"><b>${k}</b></span><span>${v}</span></li>`).join('')}</ul>
    <div class="verdict"><span class="lead">Read:</span> ${n.verdict}</div>`;
}

render();
if (wParam >= 240 && wParam <= 720) {
  widthSlider.value = String(state.width);
  widthVal.textContent = state.width + 'px';
}
</script>
