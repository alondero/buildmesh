<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" fill="none">
  <!-- Network mesh mark: 3 interconnected nodes -->
  <g id="mesh-mark">
    <!-- Node 1 (top-left) -->
    <circle cx="8" cy="8" r="3" fill="#00d4ff"/>
    <!-- Node 2 (top-right) -->
    <circle cx="20" cy="4" r="2.5" fill="#00d4ff" opacity="0.7"/>
    <!-- Node 3 (bottom-right) -->
    <circle cx="22" cy="14" r="2" fill="#00d4ff" opacity="0.5"/>
    <!-- Node 4 (bottom-left) -->
    <circle cx="6" cy="18" r="2" fill="#00d4ff" opacity="0.6"/>
    <!-- Node 5 (center) -->
    <circle cx="14" cy="11" r="2.5" fill="#8b5cf6"/>
    <!-- Connections -->
    <line x1="8" y1="8" x2="14" y2="11" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="4" x2="14" y2="11" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="22" y1="14" x2="14" y2="11" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <line x1="6" y1="18" x2="14" y2="11" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="8" x2="6" y2="18" stroke="#00d4ff" stroke-width="0.75" opacity="0.3"/>
    <line x1="20" y1="4" x2="22" y2="14" stroke="#00d4ff" stroke-width="0.75" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="30" y="14" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#e2e8f0">Build</text>
  <text x="72" y="14" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#00d4ff">mesh</text>
</svg>