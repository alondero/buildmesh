name: Android

on:
  pull_request:
    paths: ['android/**', 'scripts/check-android*.mjs', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/check-android*.mjs', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - run: npm ci
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash android/gradlew -p android assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --console=plain
      - run: bash android/gradlew -p android assembleLive assembleLiveAndroidTest -Pbuildmesh.testBuildType=live --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: buildmesh-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
