name: Android

on:
  pull_request:
    paths: ['android/**', 'scripts/check-android*.mjs', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/check-android*.mjs', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: bash android/gradlew -p android assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --console=plain
      - run: bash android/gradlew -p android assembleLive assembleLiveAndroidTest -Pbuildmesh.testBuildType=live --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildmesh-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
