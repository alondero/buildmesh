name: Release

# Tag-triggered release ONLY — never on push/PR (a full signed bundle per commit
# gets expensive fast). Bump the version with `npm run version:set -- <semver>`,
# which fans out to every file that stores it (package.json,
# src-tauri/tauri.conf.json, src-tauri/Cargo.toml, the buildmesh entry in
# src-tauri/Cargo.lock, and package-lock.json), then push a matching `vX.Y.Z`
# tag to cut a release. See docs/development/releasing.md. Issue #826.
#
# Nothing is built or published before `verify` passes on the tagged SHA, and
# the tag must point at a commit that reached `main` through the required
# checks (issue #1520). A draft release is still a release: treat the
# green-gated run as the authorization to create it.
on:
  push:
    tags:
      - "v*"

# Never cancel a release after publishing may have begun. Duplicate runs for
# the same immutable tag are serialized instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Least privilege (issue #1541). This workflow holds the updater signing keys,
# so its default token must be read-only rather than inheriting a read-write
# repository default. Only the jobs below that touch the release declare
# `contents: write` — job-level permissions replace this block rather than
# adding to it, so the `verify` job cannot escalate through it.
#
# `updater-feed` needs write and does nothing but read: GitHub only returns a
# draft release to a token with push access, so a read-only token cannot see
# the draft it has to inspect.
#
# This workflow runs only on a `v*` tag, never on a pull request, which is what
# keeps untrusted pull-request code away from the signing keys entirely.
permissions:
  contents: read

jobs:
  # Issue #1520 — a tag is only a release candidate after the *same* jobs that
  # gate a merge have passed on the tagged SHA. `release` needs this job, so
  # `tauri-action` cannot create a draft release or upload an installer from a
  # commit that fails typecheck, tests, docs, lint, or the supported-platform
  # compile checks. Re-running them here (rather than trusting the push-to-main
  # run) is what makes the tag itself, not "some commit that reached main
  # earlier", the verified artifact.
  verify:
    name: Verification
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  release:
    # The Windows installer job, and the one that creates the draft release
    # every other job uploads to. macOS packaging is `macos-release` below
    # (issue #2483); Linux is still the later slice of #835.
    needs: verify
    runs-on: windows-latest
    permissions:
      # tauri-action needs write access to create the GitHub Release + upload
      # the installer, signature, and latest.json feed.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the release-lineage guard below can prove the tag
          # is reachable from main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # This is the only persistent Windows target cache: PR smoke builds keep
      # only Cargo downloads, so three large per-OS target caches do not grow.
      - name: Cache Rust release build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Guard against a `vX.Y.Z` tag pushed without the matching version bump
      # in every manifest. tauri-action tags the release from
      # `github.ref_name` but uses the manifests' `version` for `latest.json`.
      #
      # All five version-bearing files are checked, not just the three
      # top-level manifests this step used to read: a release commit once
      # bumped four of the five and left package-lock.json behind, which
      # nothing noticed (see docs/development/releasing.md). The check is the
      # same script the `Manifest versions` job runs on every pull request, so
      # the two cannot drift apart.
      - name: Verify tag matches manifest versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading "v"
          echo "tag=v$TAG"
          node scripts/check-manifest-versions.mjs --expect "$TAG"

      # A tag cut from a side branch, or from a commit that never went through
      # the `main` ruleset, would publish a build whose exact SHA was never
      # reviewed. `verify` above proves the tree is sound; this proves it is
      # also mainline. Neither gate can be skipped by pushing a tag.
      - name: Verify tag points at a merged main commit
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not reachable from main. Merge the release commit through a pull request that passes the required checks, then retag."
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME} sha=$GITHUB_SHA is on main"

      - name: Verify and load release notes
        id: release-notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/v$TAG.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::$NOTES must exist before tagging."
            exit 1
          fi
          if ! grep -Fqx "# Buildmesh v$TAG" "$NOTES"; then
            echo "::error::$NOTES must contain '# Buildmesh v$TAG' before tagging."
            exit 1
          fi
          DELIMITER="RELEASE_NOTES_${GITHUB_RUN_ID}"
          {
            echo "body<<$DELIMITER"
            cat "$NOTES"
            # `cat` leaves a file that has no trailing newline unterminated, so
            # the closing delimiter lands on its last line and the runner rejects
            # the whole step with "Matching delimiter not found" — at the last
            # step of a release, naming a delimiter instead of the file. Emit the
            # terminating newline here so both shapes load (issue #2298).
            printf '\n%s\n' "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Build + publish signed release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — see docs/development/releasing.md for
          # one-time secret setup. These are the app's OWN update-integrity
          # keys, NOT OS code-signing certs (SmartScreen/Gatekeeper still warn).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Buildmesh ${{ github.ref_name }}"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # Flip createUpdaterArtifacts on for the release build only — the base
          # tauri.conf.json keeps it off so ordinary CI stays green without the
          # signing secret.
          args: --config src-tauri/tauri.release.conf.json
          # Generate + upload latest.json (the updater feed the app polls) and
          # the per-artifact .sig signatures.
          #
          # Three jobs write this one asset. tauri-action *merges* rather than
          # overwrites — it re-reads the published latest.json and keeps its
          # `platforms` object before writing this job's own keys — so each job
          # adds its entry without dropping the others'. It merges by
          # delete-then-upload though, which two concurrent writers would
          # interleave into a lost update, so every writer is serialised:
          # `needs: release` orders Windows ahead of macOS, `max-parallel: 1`
          # orders the macOS legs against each other, and `updater-feed` below
          # then checks the merged result before anyone can publish it.
          uploadUpdaterJson: true

      - name: Publish SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') })
          if ($assets.Count -eq 0) {
            throw 'No Windows installer assets found for checksum generation.'
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber

  # macOS installers and updater archives (issue #2483).
  #
  # Ad-hoc signed, deliberately and permanently: the overlay config carries the
  # `-` signing identity, which needs no Apple membership, certificate, Apple
  # ID, team or API key. What it does *not* give is Developer ID trust, so
  # Gatekeeper still blocks the first launch until the user opens the app by
  # hand. That is the accepted cost of shipping macOS builds without paying
  # Apple; notarization stays out of scope (#834).
  #
  # One leg per architecture because that is what GitHub's runner images give
  # us: `macos-15` is arm64 and `macos-15-intel` is Intel. A universal bundle
  # would compile both architectures on one
  # runner anyway and then lipo them together, so it saves no build time while
  # adding a step that can only produce one updater entry for two platforms.
  macos-release:
    name: macOS ad-hoc signed
    # Serialised behind the Windows job because that job's tauri-action is what
    # creates the draft release this one uploads to. verify is waited on
    # transitively, exactly as android-release does.
    needs: release
    permissions:
      # Uploading the DMG, the .app.tar.gz updater archive, the .sig and the
      # merged latest.json to the draft the previous job created.
      contents: write
    strategy:
      # Load-bearing, not a speed knob: every packaging job writes the same
      # latest.json asset and tauri-action merges it by delete-then-upload, so
      # two writers running at once interleave into a lost update — each
      # re-reading a feed the other has already deleted. The Windows leg is
      # ordered ahead by `needs`; this orders the two macOS legs.
      max-parallel: 1
      # Do not cancel the surviving leg: a failed release should cost a second
      # build's log, not hide the reason the first one failed.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. Apple Silicon hardware starts at macOS 11, so the
          # overlay asks for 11.0 rather than Tauri's 10.13 default floor,
          # which is not a linkable deployment target for this architecture.
          - runner: macos-15
            target: aarch64-apple-darwin
            config: src-tauri/tauri.macos-release.conf.json
            arch: aarch64
          # Intel. 10.13 is Tauri's documented minimum and the floor for this
          # architecture.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            config: src-tauri/tauri.macos-release-intel.conf.json
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # No Swatinem/rust-cache here on purpose. Its own documentation lists
      # macOS target directories as a source of corrupted caches, and
      # docs/development/releasing.md already records that the macOS platform
      # smoke keeps no target cache for the same reason. This leg runs a handful
      # of times a year and eats the cold build; a flaky release is worse.

      - name: Install frontend dependencies
        run: npm ci

      - name: Build + publish ad-hoc signed release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The same app-owned minisign updater key the Windows job uses. This
          # is update integrity, not OS signing: it proves the archive matches
          # the one in the feed and does nothing for Gatekeeper.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Buildmesh ${{ github.ref_name }}"
          # No releaseBody here. The notes are loaded and applied by the Windows
          # job's `release-notes` step, and this job has no such step to read
          # them from. Today that would be harmless rather than destructive —
          # tauri-action rewrites a release's name and body only when it is NOT
          # a draft — but an empty body would blank the published notes the
          # moment anyone turned releaseDraft off. Leave it out rather than
          # leave it out wrongly.
          #
          # This comment is load-bearing with the line below it: if releaseDraft
          # is ever turned into an input, restore releaseBody here from the same
          # docs/releases note the Windows job reads, or gate this action so it
          # cannot update a published release without a body.
          releaseDraft: true
          prerelease: false
          # --config selects the overlay that turns on updater artifacts and
          # sets the ad-hoc signing identity and this architecture's minimum
          # macOS version. --target keeps the build native to the runner, which
          # is why the two legs are two architectures rather than one universal
          # bundle.
          args: --target ${{ matrix.target }} --config ${{ matrix.config }}
          # Same merge contract as the Windows job above — this leg adds
          # `darwin-<arch>` to the shared feed rather than replacing it.
          uploadUpdaterJson: true

      # Proves the artifact carries a real signature and that it is the ad-hoc
      # kind. Asserting the *kind* matters: an unsigned bundle also passes
      # `codesign --verify` on some setups, and a runner that happened to hold a
      # Developer ID identity must not quietly produce a differently-signed
      # release than the one documented.
      - name: Verify the ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Buildmesh.app"
          if [[ ! -d "$APP" ]]; then
            echo "::error::No application bundle at $APP"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          if ! grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"; then
            echo "::error::Expected an ad-hoc signature (Signature=adhoc) and got something else. Do not publish a macOS release signed by an identity this workflow does not document."
            exit 1
          fi
          # Record the minimum macOS version the bundle actually declares, so
          # the number in the docs is evidence rather than an assumption. This
          # is what LSMinimumSystemVersion gates at launch; whether a real Mac
          # of that version runs the app is issue #2484's question.
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist" \
            | tee "$RUNNER_TEMP/lsminimumsystemversion.txt"

      # Covers the DMG a person installs and the .app.tar.gz the updater
      # fetches. A separate file per architecture so neither leg can overwrite
      # the other's, and neither touches the Windows SHA256SUMS.txt.
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ASSETS="$RUNNER_TEMP/macos-release-assets.json"
          MANIFEST="SHA256SUMS-macos-${{ matrix.arch }}.txt"
          # Read back the release action's actual asset names and hash the
          # downloaded published bytes. Never synthesize a manifest filename
          # from the local bundle name.
          gh release view "$TAG" --json assets > "$RELEASE_ASSETS"
          node scripts/ci/publish-macos-checksums.mjs \
            "$TAG" "${{ matrix.arch }}" "$RELEASE_ASSETS" \
            "$RUNNER_TEMP/macos-release-assets" "$MANIFEST"
          gh release upload "$TAG" "$MANIFEST" --clobber

  # Download the DMG back from the draft on native runners. The build job's
  # output alone does not prove that the uploaded bytes match their checksum or
  # retain the expected app signature, architecture and deployment target.
  # These audit assets deliberately label browser quarantine, Gatekeeper and
  # Finder as manual; the hosted runner cannot establish those user-visible
  # observations.
  macos-candidate-audit:
    name: Downloaded macOS candidate audit (${{ matrix.arch }})
    needs: macos-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            minimum: "11.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum: "10.13"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Verify candidate audit success path through its CLI
        run: node --test tests/agent-infra/macos-candidate-audit.test.mjs

      - name: Download, inspect and record the exact draft DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
          MINIMUM_MACOS: ${{ matrix.minimum }}
        run: |
          set -euo pipefail
          node scripts/ci/audit-macos-candidate.mjs \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --arch "$ARCH" \
            --minimum-macos "$MINIMUM_MACOS" \
            --repo "$GITHUB_REPOSITORY"

  # The feed is the one artifact a running install downloads on its own, so
  # nothing about it may be taken on trust from "the jobs were green". This
  # reads the draft's real latest.json back off the release and checks that
  # every packaged platform is present, signed and pointing at an artifact that
  # exists — the failure being a macOS leg that uploaded its archive but whose
  # entry never made it into the merged feed, which would otherwise ship as a
  # green release whose macOS installs cannot update.
  updater-feed:
    name: Verify updater feed
    needs: [release, macos-release, macos-candidate-audit]
    runs-on: ubuntu-latest
    permissions:
      # Write, not read, and not for anything this job does: GitHub only
      # returns a draft release to a token with push access, so a read-only
      # token gets a 404 on the very draft it is meant to inspect. The job
      # below only ever reads — it corrects nothing, it reports whether the
      # draft is publishable.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Download the draft feed and its asset list
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/feed"
          gh release view "$TAG" --json assets > "$RUNNER_TEMP/assets.json"

      - name: Check every packaged platform is in the feed
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-updater-feed.mjs "$RUNNER_TEMP/feed/latest.json" \
            --expect-version "${TAG#v}" \
            --require windows-x86_64 \
            --require darwin-aarch64 \
            --require darwin-x86_64 \
            --assets "$RUNNER_TEMP/assets.json"

  # The native Android client ships beside the Windows installers, signed with a
  # developer-owned key that is never stored in this repository. `needs: release`
  # rather than `needs: verify` because tauri-action is what creates the draft
  # release this job uploads to; verify is waited on transitively.
  android-release:
    name: Android signed APK
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Uploading the APK to the release the previous job created.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build, sign and upload the APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Missing signing material is a configuration gap, not a broken build:
          # the Windows release above is already published by this point, so
          # failing here would strand it as a draft. Say so loudly and stop.
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "::warning title=Android APK not published::ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are not configured, so this release ships Windows-only. See docs/development/android.md."
            exit 0
          fi
          # A secret set from Windows PowerShell 5.1 (`$s | gh secret set`) gains a
          # trailing CRLF, which `base64 --decode` rejects. Strip it rather than
          # fail after the Windows release is already in draft.
          ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS%$'\n'}"; ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS%$'\r'}"
          ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD%$'\n'}"; ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD%$'\r'}"
          export ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          KEYSTORE="$RUNNER_TEMP/buildmesh-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE"
          bash android/gradlew -p android assembleRelease --console=plain
          APK="$(ls android/app/build/outputs/apk/release/*.apk)"
          if [[ -z "$APK" ]]; then
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi
          # The file name carries the same version the APK reports internally,
          # because build.gradle.kts reads it from package.json rather than a
          # literal — see the version wiring there.
          NAME="Buildmesh_${TAG#v}_android.apk"
          cp "$APK" "$RUNNER_TEMP/$NAME"
          ( cd "$RUNNER_TEMP" && sha256sum "$NAME" > "${NAME}.sha256" )
          gh release upload "$TAG" "$RUNNER_TEMP/$NAME" "$RUNNER_TEMP/${NAME}.sha256" --clobber
