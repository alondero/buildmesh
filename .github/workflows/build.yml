name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Retain end-to-end installer coverage without packaging every commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer commit on the same PR or branch supersedes an in-flight build. This
# keeps rapid agent pushes from consuming runners for results nobody can merge.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri 2 on Linux links against webkit2gtk-4.1, librsvg2, libayatana-
      # appindicator3, libxdo, and OpenSSL even when running the Rust tests.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the expensive Linux test build once. The platform smoke jobs
      # deliberately do not persist their target directories, avoiding three
      # large OS-specific target caches.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Typecheck the frontend against the committed bindings and build the
      # mobile bundle required by the Rust tests.
      - name: Typecheck frontend + build mobile bundle
        run: npx tsc --noEmit && npm run build:mobile

      # Runs the Rust suite AND regenerates the shared TS bindings (ts-rs emits
      # them from `#[derive(TS)]` during `cargo test`). Issue #359.
      - name: Rust tests + regenerate TS bindings
        run: cargo test --locked
        working-directory: src-tauri

      # Fail CI if any code path spawns `git` via bare `Command::new("git")`
      # or sets `creation_flags` inline. Only process_util may own those details.
      - name: Verify no inline process-spawn patterns outside process_util (gh665/gh690)
        shell: bash
        run: |
          HITS=$(find src-tauri/src \
                  -type f -name '*.rs' \
                  ! -name '*_tests.rs' \
                  ! -name 'tests.rs' \
                  ! -path '*/tests/*' \
                  ! -name 'process_util.rs' \
                  -exec grep -nE '\.creation_flags\(|std::process::Command::new\("git"\)' {} + \
                  | grep -v '// allow-inline-process-spawn' \
                  || true)
          if [ -n "$HITS" ]; then
            echo "::error::Inline process-spawn pattern outside process_util (issue #665 / #690):"
            echo "$HITS"
            echo "::error::Use crate::process_util::command_no_window(\"program\") so CREATE_NO_WINDOW is set on Windows."
            exit 1
          fi

      # Fail CI if the committed bindings drift from what the Rust structs now
      # generate — wire-shape drift becomes a red build, not a runtime crash.
      - name: Check Rust↔TS type bindings are up to date
        shell: bash
        run: |
          git add --intent-to-add src/types/generated
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test' in src-tauri/ and commit the changes under src/types/generated/."
            exit 1
          fi

      # Manual runs additionally exercise the real CLI contract at a known
      # version. Regular PRs stay hermetic and use deterministic help-parser
      # coverage in the Rust suite.
      - name: Install pinned Codex CLI for proxy contract smoke
        if: github.event_name == 'workflow_dispatch'
        run: npm install --global @openai/codex@0.147.0

      - name: Verify pinned Codex profile routing on fresh and resume
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked pinned_codex_cli_loads_profile_for_fresh_and_resume -- --ignored
        working-directory: src-tauri

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    # A failure on one operating system must not hide a regression on the
    # other. Linux compilation and linking are covered by the quality job.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the Cargo download cache but do not retain an OS-specific target
      # directory for these smoke builds.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      # Compile and link the real Tauri application on each remaining host,
      # including the frontend beforeBuildCommand, without spending time or
      # storage on transient installers. Tagged releases remain authoritative.
      - name: Compile Tauri app without installers
        run: npm run tauri build -- --debug --no-bundle

  wsl-profile-smoke:
    name: WSL Codex profile contract (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify default and explicit WSL Codex homes
        run: cargo test --locked wsl_profile_materializes_in_default_and_explicit_codex_home -- --ignored
        working-directory: src-tauri

  package-smoke:
    name: Weekly package smoke (${{ matrix.os }})
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Weekly packaging is deliberately cold apart from Cargo downloads. A
      # one-off smoke check does not justify three persistent target caches.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      # Validate that Tauri can still produce every configured native bundle.
      # Artifacts are intentionally not uploaded; signed tagged releases are
      # the supported distribution path.
      - name: Build native installers
        run: npm run tauri build
