name: Build

# Orchestrates the repository's verification runs. The jobs that gate a merge
# live in `verify.yml` because `release.yml` must run the *same* jobs against a
# tagged SHA before it publishes (issue #1520). Renaming a job there renames a
# required status check, so it is a branch-protection change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Retain end-to-end installer coverage without packaging every commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer commit on the same PR or branch supersedes an in-flight build. This
# keeps rapid agent pushes from consuming runners for results nobody can merge.
#
# The event name is part of the group on purpose (issue #1520). A schedule and
# a push to `main` share the same `github.ref`, so without it they land in one
# group and `cancel-in-progress: true` lets a routine push kill the weekly
# package run mid-flight — cancelling the very job whose failure is supposed to
# raise the `ci-alert` issue. Keying by event means only a newer run of the
# *same* trigger can supersede an in-flight one.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege (issue #1541). Without an explicit block a workflow inherits
# the repository's default `GITHUB_TOKEN` permissions, which can be read-write.
# Nothing in this workflow needs to write to the repository except the
# `alert-on-failure` job, which opens a tracking issue and declares its own
# narrower permissions. Job-level permissions *replace* this block rather than
# adding to it.
permissions:
  contents: read

jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/verify.yml
    with:
      # Push runs to main are the post-merge signal: profile `light` skips the
      # Rust graph, because the merge gate already ran it against the same
      # commit through the pull request and main moves several times a day.
      # `quality`, `verify-smoke`, and both `platform-smoke` jobs still run.
      # Pull requests, the weekly schedule, manual dispatches, and release
      # tags get `full`. Required checks are only evaluated on pull-request
      # runs, which are therefore always full.
      profile: ${{ github.event_name == 'push' && 'light' || 'full' }}

  wsl-profile-smoke:
    name: WSL Codex profile contract (opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # The runner image ships the WSL feature but no distribution, and the
      # contract test below is `#[ignore]`d precisely because it needs a real
      # guest. Importing one is what makes this job establish the precondition
      # it asserts rather than fail inside the test for want of a guest
      # (issue #1954).
      - name: Provision a WSL distribution
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04

      - name: Verify default and explicit WSL Codex homes
        run: cargo test --locked wsl_profile_materializes_in_default_and_explicit_codex_home -- --ignored
        working-directory: src-tauri

  package-smoke:
    name: Weekly package smoke (${{ matrix.os }})
    needs: verify
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-linux-build-deps

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Weekly packaging is deliberately cold apart from Cargo downloads. A
      # one-off smoke check does not justify three persistent target caches.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      # Validate that Tauri can still produce every configured native bundle.
      # Artifacts are intentionally not uploaded; signed tagged releases are
      # the supported distribution path.
      - name: Build native installers
        run: npm run tauri build

  # A scheduled run has no pull request to turn red and nobody is waiting on a
  # merge button, so GitHub's run status alone can go unnoticed for a week.
  # Open (or update) a tracking issue so a broken weekly build is a visible,
  # reviewable result rather than a silently missed run (issue #1520).
  #
  # Push and pull-request runs deliberately skip this job: their red state is
  # already surfaced on the PR and enforced by the `main` ruleset.
  alert-on-failure:
    name: Alert on failure
    needs: [verify, wsl-profile-smoke, package-smoke]
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      # Read the run URL and comment; nothing else in this job writes anywhere.
      actions: read
      issues: write

    steps:
      - name: Open or update the failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `--force` keeps this working if the label was ever deleted; the
          # step must not fail merely because metadata is missing.
          gh label create ci-alert --color B60205 \
            --description "Automated alert for a failed Build workflow run" --force >/dev/null 2>&1 || true
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Build run [${{ github.run_number }}]($RUN_URL) failed on \`${{ github.event_name }}\` for \`${{ github.ref_name }}\` at ${{ github.sha }}.

          Investigate the run, then close this issue once the weekly package
          smoke is green again. If the failure is a real regression, the next
          fix must land through a pull request that passes the required checks."

          EXISTING=$(gh issue list --state open --label ci-alert --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing alert issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening a new alert issue"
            gh issue create --title "CI alert: Build run #${{ github.run_number }} failed" --body "$BODY" --label ci-alert
          fi
