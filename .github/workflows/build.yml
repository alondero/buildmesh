name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Don't cancel the other platforms when one fails — every PR should
    # surface all three results so a Linux regression can't hide behind a
    # passing Windows build. Drives the cross-platform readiness gate
    # (issue #825).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2 on Linux links against webkit2gtk-4.1, librsvg2, libayatana-
      # appindicator3, libxdo, and uses patchelf for the AppImage; libssl-dev
      # is needed because `reqwest` (without `rustls-tls`) prefers the
      # system's OpenSSL. Without these `cargo test` fails to even resolve
      # the `tauri` build script. macOS bundles its own WebKit/SecureTransport
      # stack, and Windows images ship everything WebView2 needs, so neither
      # needs an extra install step.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Install frontend dependencies
        run: npm ci

      # Typecheck the frontend against the committed bindings, and build just
      # the mobile bundle (a Rust test asserts dist/mobile/index.html exists).
      # The full shippable build runs once via tauri's beforeBuildCommand below,
      # so we deliberately don't run the whole `npm run build` twice here.
      - name: Typecheck frontend + build mobile bundle
        run: npx tsc --noEmit && npm run build:mobile

      # Runs the Rust suite AND regenerates the shared TS bindings (ts-rs emits
      # them from `#[derive(TS)]` during `cargo test`). Issue #359.
      - name: Rust tests + regenerate TS bindings
        run: cargo test
        working-directory: src-tauri

      # Fail CI if any code path spawns `git` via bare `Command::new("git")`
      # or sets `creation_flags` inline — only `process_util::command_no_window(...)`
      # (which sets CREATE_NO_WINDOW on Windows) is allowed, and that's the only
      # site permitted to call `.creation_flags(`. Test files are excluded because
      # `cargo test` owns its own console. Broadened in #690 from services/ + agent/
      # to all of src-tauri/src/. Issues #665 + #690.
      #
      # Uses `find … -exec grep` instead of `rg` so the same script runs on
      # the Windows Git Bash runner *and* the default shells on ubuntu/macos
      # runners (where `rg` isn't preinstalled and macOS grep is BSD, lacking
      # GNU `--include`/`--exclude`). Negligible cost — the tree has ~150 Rust
      # source files. The trailing `// allow-inline-process-spawn: <reason>`
      # opt-out uses the same mid-expression comment shape as the antipattern
      # guard's `// allow-dispose` / `// allow-wsl-path`, but the marker is
      # honored only by this step's `grep -v` below — local guard-antipatterns
      # has no matching rule. The opt-out exists for the rare helper inside a
      # `#[cfg(test)] mod tests { … }` block living in a non-`_tests.rs`
      # production file (e.g. `services/warm_pool.rs`'s test helpers).
      - name: Verify no inline process-spawn patterns outside process_util (gh665/gh690)
        shell: bash
        run: |
          HITS=$(find src-tauri/src \
                  -type f -name '*.rs' \
                  ! -name '*_tests.rs' \
                  ! -name 'tests.rs' \
                  ! -path '*/tests/*' \
                  ! -name 'process_util.rs' \
                  -exec grep -nE '\.creation_flags\(|std::process::Command::new\("git"\)' {} + \
                  | grep -v '// allow-inline-process-spawn' \
                  || true)
          if [ -n "$HITS" ]; then
            echo "::error::Inline process-spawn pattern outside process_util (issue #665 / #690):"
            echo "$HITS"
            echo "::error::Use crate::process_util::command_no_window(\"program\") so CREATE_NO_WINDOW is set on Windows."
            exit 1
          fi

      # Fail CI if the committed bindings drift from what the Rust structs now
      # generate — wire-shape drift becomes a red build, not a runtime crash.
      - name: Check Rust↔TS type bindings are up to date
        shell: bash
        run: |
          # --intent-to-add surfaces any brand-new binding (a type whose .ts
          # was never committed) in `git diff`, not just edits to tracked files.
          git add --intent-to-add src/types/generated
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test' in src-tauri/ and commit the changes under src/types/generated/."
            exit 1
          fi

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          # Per-OS name so all three matrices publish distinct downloads
          # (`buildmesh-installer-Linux`, `-macOS`, `-Windows`). Note:
          # `runner.os` is used (not `matrix.os`) — `matrix.os` yields
          # `ubuntu-latest` / `macos-latest` / `windows-latest`, which would
          # append `-latest` to the artifact name and break the stable
          # download URL. Issue #825.
          name: buildmesh-installer-${{ runner.os }}
          path: src-tauri/target/release/bundle/**/*
