name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          cache: true

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Install frontend dependencies
        run: npm ci

      # Typecheck the frontend against the committed bindings, and build just
      # the mobile bundle (a Rust test asserts dist/mobile/index.html exists).
      # The full shippable build runs once via tauri's beforeBuildCommand below,
      # so we deliberately don't run the whole `npm run build` twice here.
      - name: Typecheck frontend + build mobile bundle
        run: npx tsc --noEmit && npm run build:mobile

      # Runs the Rust suite AND regenerates the shared TS bindings (ts-rs emits
      # them from `#[derive(TS)]` during `cargo test`). Issue #359.
      - name: Rust tests + regenerate TS bindings
        run: cargo test
        working-directory: src-tauri

      # Fail CI if the committed bindings drift from what the Rust structs now
      # generate — wire-shape drift becomes a red build, not a runtime crash.
      - name: Check Rust↔TS type bindings are up to date
        shell: bash
        run: |
          # --intent-to-add surfaces any brand-new binding (a type whose .ts
          # was never committed) in `git diff`, not just edits to tracked files.
          git add --intent-to-add src/types/generated
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test' in src-tauri/ and commit the changes under src/types/generated/."
            exit 1
          fi

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: buildmesh-installer
          path: src-tauri/target/release/bundle/**/*