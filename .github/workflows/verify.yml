name: Verify

# The merge gate and the release gate, in one place (issue #1520).
#
# `build.yml` calls this workflow for every push to `main`, every pull request,
# and the weekly schedule; `release.yml` calls it again for the tagged SHA
# before it builds or uploads anything. Publishing from an unverified commit is
# therefore structurally impossible: the `release` job `needs` this workflow.
#
# Keeping the jobs here (rather than in `build.yml`) means the required job
# names below are literally the same checks `main` requires and the ones a
# release tag is verified by. The names are part of the branch-protection
# ruleset, so renaming one here is a policy change: update the ruleset and
# docs/development/releasing.md in the same commit.
#
# The jobs form a fan-out, not a chain. `changes` (change-scope
# classification) and `quality` (frontend) start at t=0; `manifest-versions`
# starts with them and is the one job with no dependency at all. `changes` reads
# the pull request's diff and the Rust branch of the graph (`rust-build`, the
# seven `rust-tests` shards, `rust-nonshard`, and the `rust-bindings` aggregate) only starts
# when it reports that Rust moved, so a frontend-only pull request never
# compiles and a Rust-only pull request never boots the browser suites.
# Nothing waits behind one ~10-minute monolith any more: a runner that takes
# a few minutes to be handed over delays only its own branch of the graph,
# not every job behind it.
#
# Job event guards use the *caller's* event name, which is what keeps the
# weekly schedule off the browser job: a scheduled run skips `verify-smoke`.
# `platform-smoke` is a post-merge signal rather than a merge gate (it is not
# among the required checks in `docs/development/releasing.md`): it runs on
# pushes - to main and to a release tag - and on manual dispatches, while
# pull requests rely on `rust-build` for the Linux compile.
#
# The `profile` input narrows push runs further. `full` (pull requests, the
# weekly schedule, manual dispatches, release tags) runs the whole graph.
# `light` (pushes to main) skips the Rust branch entirely, leaving `quality`,
# `verify-smoke`, and `platform-smoke` as the post-merge signal: the merge
# gate already ran the Rust suite against the same commit through the pull
# request, and main moves several times a day. Required checks are only ever
# evaluated on pull-request runs, which are always `full`.
on:
  workflow_call:
    inputs:
      profile:
        description: >-
          full runs the merge gate (Rust compile, shards, bindings); light
          skips the Rust graph and is used for post-merge push runs.
        type: string
        required: false
        default: full

# Least privilege: this workflow only ever checks out code and runs the test,
# lint, docs, and compile gates. Nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classify what a pull request touched so each graph can skip itself.
  # Runs on every event: for anything that is not a pull request
  # (scripts/ci/changed-scope.mjs gets no --base) the script reports the full
  # scope, so pushes, schedules, dispatches, and release tags still run
  # everything. The outputs feed `rust-build`, `quality`'s browser/vitest
  # steps, and `verify-smoke`.
  #
  # If this job fails, its empty outputs are read as "unknown" and unknown
  # runs everything: `quality` starts anyway (`if: !cancelled()`) and its
  # browser/vitest steps plus `verify-smoke` treat an empty output as a
  # frontend change. Only the Rust branch holds back on the compile - the
  # required `Rust tests + TS bindings` check runs its guard, which fails
  # closed on a classification that did not succeed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      frontend: ${{ steps.classify.outputs.frontend }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            node scripts/ci/changed-scope.mjs --base "$PR_BASE"
          else
            node scripts/ci/changed-scope.mjs
          fi

  # The app version lives in five files (package.json, tauri.conf.json,
  # Cargo.toml, the buildmesh entry in Cargo.lock, and package-lock.json),
  # and a bump that reaches four of them is a silent failure until something
  # reads the fifth. This job is a pure read of those six version sites, so it
  # needs no `npm ci`, no change-scope classification, and no upstream job: it
  # starts at t=0 on every event and finishes in seconds. The same script backs
  # `npm run check:versions` locally and the tag gate in release.yml, so the
  # pull-request check and the release check cannot drift apart.
  #
  # Invoked as `node scripts/...` rather than through npm so the job provably
  # needs no dependency install.
  manifest-versions:
    name: Manifest versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check every manifest agrees on one version
        run: node scripts/check-manifest-versions.mjs

  # The dependency and workflow supply-chain gate (issue #1541).
  #
  # Deliberately NOT on the `changes` fan-out and deliberately NOT inside
  # `quality-gates`: this job has to run on *every* event, including a pull
  # request that touched nothing but a workflow. A supply-chain gate that only
  # runs when Rust moved is a gate that misses exactly the diff it exists to
  # catch — an unpinned action, or a lockfile bump that pulls in a vulnerable
  # package, changes no Rust source file. It also starts at t=0 (only a checkout
  # precedes it).
  #
  # Step order is part of the contract, not an accident: the two dependency-free
  # checks run first and finish in seconds, so an unpinned action or a vulnerable
  # npm package is reported in seconds. Only then does the job pay for building
  # `cargo-audit`, which is cached after the first run.
  #
  # The three checks are separate steps rather than one "audit" step, because
  # they fail for different reasons and are fixed by different people:
  #
  #   * action pins — every third-party `uses:` must be a full commit SHA. This
  #     is the check with teeth against the release job: it holds `contents:
  #     write` and the updater signing keys, so a mutable tag there is remote code
  #     execution with signing authority.
  #   * npm audit — production dependencies are held to a stricter threshold than
  #     dev dependencies, because production packages ship inside the artifact
  #     and dev packages do not.
  #   * cargo audit — vulnerabilities always fail; maintenance warnings need a
  #     recorded owner, rationale and review date in
  #     .github/rustsec-exceptions.json, and an expired review fails too.
  #
  # `--verify` on the pin gate resolves each pinned SHA against the GitHub API,
  # so a typo or a truncated SHA fails here instead of at run time. It runs on a
  # pull request with the default `GITHUB_TOKEN`, which can read public
  # repositories, and it reads no secrets.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The two dependency-free checks come first, before anything that compiles.
      # They need no install and finish in seconds, so an unpinned action or a
      # vulnerable npm package is reported in seconds rather than after the
      # cargo-audit build below — which is what the job header claims this job
      # costs, and until this ordering was fixed it did not.
      - name: Check every third-party action is SHA-pinned
        # `gh api` refuses to run in a workflow without a token, so --verify
        # fails on every reference until one is supplied. This is the job's own
        # automatic token at `contents: read` (the top-level block), used only
        # to read public repositories — not a repository secret.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-action-pins.mjs --verify

      - name: Check npm dependencies against the advisory policy
        run: node scripts/check-npm-audit.mjs

      # `cargo audit` is NOT preinstalled on ubuntu-latest, and building it from
      # source costs ~2m45s. The binary is cached on this file's own hash: the
      # first run on a given key pays the compile, later runs restore it in a
      # second or two, and editing this workflow is what deliberately invalidates
      # the entry.
      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('.github/workflows/verify.yml') }}

      # Install only when the cache did not provide it, so a runner image that
      # starts shipping cargo-audit costs nothing, and fail loudly rather than
      # skipping the check: a supply-chain gate that silently degrades to "no Rust
      # check" is worse than no gate, because it reads as green.
      - name: Ensure cargo-audit is available
        run: |
          if ! cargo audit --version; then
            cargo install cargo-audit --locked
          fi
          cargo audit --version

      - name: Check Rust dependencies against the RustSec policy
        run: node scripts/check-rust-advisories.mjs

  # The fast, frontend-only gate — the first result a PR hears back from. It
  # deliberately no longer compiles Rust: that moved to `rust-build`, so the
  # Rust shards and both platform-smoke jobs no longer wait behind it.
  #
  # It is an *aggregate* (issue #2046): the static gates and the vitest suites
  # run as parallel jobs, because one vitest invocation over both suites was
  # 220s of a ~310s job — the whole critical path for a frontend-only pull
  # request. The required status-check name is owned by branch protection
  # (docs/development/releasing.md), so this job keeps the `Quality (Linux)`
  # name and its aggregate meaning, and it does no work of its own: it
  # certifies that both branches underneath it succeeded.
  quality:
    name: Quality (Linux)
    needs: [changes, quality-gates, quality-tests]
    # `always()`, and never a skip of its own. A required status check that
    # GitHub reports as *skipped* counts as satisfied, so the aggregate must
    # run in every class and decide in its guard, where the reason an upstream
    # branch is absent is visible (scripts/ci/quality-gate.mjs).
    #
    # An earlier revision of this split skipped on
    # `needs.changes.outputs.frontend == 'false'` to save a few seconds, and
    # that broke the merge gate in both directions (issue #2046 review):
    #
    #   * `Rust tests + TS bindings` requires `Quality (Linux)` == success, so
    #     on every Rust-only pull request the aggregate skipped, that required
    #     check went red with "the Rust suite is not fully green", and the
    #     pull request could not merge — for a suite that had never run.
    #   * On a docs-only pull request the aggregate skipped while
    #     `Quality gates (Linux)` still ran and could fail, leaving all three
    #     required checks skipped (satisfied) over a red non-required one.
    #
    # The wall-clock win this job was meant to deliver came from running
    # `quality-gates` and `quality-tests` in parallel, not from skipping, and
    # the guard is a few seconds.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The guard is a script in this repository, so this job checks it out
      # even though it runs nothing else. (`npm ci` is not needed: the guard has
      # no dependencies, and skipping it is the point of the job being seconds.)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Refuse to pass unless the frontend branch is fully green
        run: node scripts/ci/quality-gate.mjs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          GATES_RESULT: ${{ needs.quality-gates.result }}
          TESTS_RESULT: ${{ needs.quality-tests.result }}

  # The static half of the frontend gate: the cheap checks, the frontend build,
  # and the bundle budget. Split out of `quality` so it runs *beside* the vitest
  # suites instead of in front of them — issue #2046. Nothing here needs a
  # browser or a test run, so it never waits on either.
  quality-gates:
    name: Quality gates (Linux)
    needs: changes
    # Runs even when the change-scope job failed: a required check that skips
    # reports green, and the aggregate above must not certify a tree whose
    # classification never succeeded. `!cancelled()` rather than `always()` so
    # a superseded run still stops. The steps gated on the classification
    # below treat an empty output as "unknown, run it" for the same reason.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A backstop above the real work (npm ci, the static gates, and the
    # frontend build). It no longer contains the Rust compile, so the old
    # 150-minute floor — sized around a lost-runner hang in `cargo test` — is
    # unnecessary: a hung step here is caught far sooner.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      # `npm ci` must precede every step that loads a dependency. `test:lint`
      # runs the ESLint fixture verifier in-process, and on a clean runner it
      # died with ERR_MODULE_NOT_FOUND for 'eslint' when this step sat below it
      # (issue #1520). Cheap gates first, expensive build after.
      - name: Install frontend dependencies
        run: npm ci

      - name: Check agent infrastructure and changed-code rules
        env:
          AGENT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          # test:agent runs check-agent-diff; test:readme runs the
          # README drift gate's in-memory tests; test:lint runs the
          # lint-fixtures verifier's in-memory tests. Invoking the npm
          # scripts explicitly (instead of a `tests/agent-infra/*.test.mjs`
          # glob) keeps CI in lock-step with what `scripts/check.ps1`
          # invokes locally.
          npm run test:agent
          npm run test:docs
          npm run test:readme
          npm run test:lint
          base="$AGENT_DIFF_BASE"
          if [[ "$base" =~ ^0+$ ]]; then base=HEAD; fi
          node scripts/check-agent-diff.mjs --base "$base"

      # Issue #1545 — gate the README against drift in the Provider enum
      # count, supported-platforms claim, SmartScreen warning, and the
      # CLAUDE.md "no internal issue numbers in user-facing docs" rule.
      # Cheap (no build), runs in ~50ms; safe to add at the top of the
      # job so a stale landing page fails before any build starts.
      - name: Check README drift (issue #1545)
        run: npm run check:readme

      - name: Check documentation contract
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          base="$DOCS_DIFF_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=HEAD; fi
          if git rev-parse --verify --end-of-options "${base}^{commit}" >/dev/null 2>&1; then
            node scripts/check-docs.mjs --base "$base"
          else
            echo "::warning::Documentation impact diff base '$base' is unavailable; running the structural documentation check only."
            node scripts/check-docs.mjs
          fi

      # Issue #1542 — enforced ESLint + React Hooks gate. Two steps:
      #  (a) `npm run lint` runs ESLint across the codebase; the flat
      #      config excludes `src/types/generated/**`, `dist/**`, the
      #      agent working dir, docs, and the lint-fixtures dir so a
      #      clean checkout passes. Catches conditional-hook crashes
      #      (closed #1242 was a real one) before they ship.
      #  (b) `npm run lint:fixtures` runs ESLint against the two
      #      intentional-violation fixtures and asserts each one trips
      #      its target rule. This is the inverse of (a) — it must
      #      succeed (the gate is live), proving a future rule tweak
      #      that accidentally silences React Hooks would fail CI.
      # Run before the build so a syntax-level regression trips in
      # seconds rather than waiting for tsc + vite.
      - name: ESLint gate (issue #1542)
        run: npm run lint

      - name: ESLint fixtures verifier (issue #1542)
        run: npm run lint:fixtures

      # Typecheck the frontend against the committed bindings and build the
      # desktop + mobile bundles the budget gate below measures. `npm run build`
      # runs `tsc` itself, so this step is just `npm run build` (no separate
      # `tsc --noEmit`).
      - name: Build desktop + mobile bundles
        run: npm run build

      # Issue #1568 - gate the desktop initial JS/CSS bundles against the
      # documented budget in `scripts/bundle-budget.json`. The script exits
      # non-zero on a breach so a regression on the entry chunk becomes a
      # red build instead of a hidden cost on first paint. We run it here
      # (after the build) rather than inside the test step because the
      # budget applies to release artifacts, not the dev server.
      - name: Check desktop initial bundle budget (issue #1568)
        run: npm run check:bundle

      # `tests/integration/ui-shot.test.ts` drives the fixture UI in headless
      # Chromium (scripts/ui-shot.mjs) and is the one suite that needs a
      # browser build. It now runs in the `quality-tests` leg that owns the
      # integration suite, which installs Chromium there — not here, so a
      # frontend-only pull request no longer pays for a browser the vitest
      # branch installs on its own critical path.
      #
      # Fail CI if any code path spawns `git` via bare `Command::new("git")`
      # or sets `creation_flags` inline. Only process_util may own those details.
      # Node-only, so it lives in the fast frontend gate rather than the compile.
      - name: Verify no inline process-spawn patterns outside process_util (gh665/gh690)
        run: node scripts/check-process-spawn-discipline.mjs

  # The vitest half of the frontend gate, as parallel legs (issue #2046).
  #
  # One `vitest run tests/unit tests/integration` measured 220s — 126s on one
  # run, 212s on another — and Quality was the entire critical path for a
  # frontend-only pull request. Profiling the suite (287 files) showed the
  # serial test time splits almost evenly: the unit suites are 312s across 277
  # files and the ten integration files are 88s, but one of those,
  # `ui-shot.test.ts`, is 80s of it because it drives a real browser.
  #
  # So the unit suite is split by vitest's own `--shard` (which balances by file
  # duration and gives every file to exactly one shard) and the integration
  # suite — one slow browser-bound file — stays whole in a third leg. Measured
  # locally, that is 139 and 138 files with zero overlap.
  #
  # Only the integration leg installs Chromium, and that is not a guess: the
  # unit suites name no browser test. The three unit files that mention
  # Playwright read `ui-shot-node-status.steps.mjs` as *text* or quote Chromium
  # in a comment, and no file under tests/unit calls `launchChromium`, so the
  # split does not scatter the browser across legs whose shard assignment
  # cannot be predicted from here. `browser` is still declared per leg so a leg
  # that does need one says so, and a missing browser fails loudly anyway:
  # `launchChromium` throws rather than skipping.
  #
  # `tests/agent-infra/vitest-legs.test.mjs` gates this matrix: the shard
  # indices must be exactly 1..N over one N, the suite directories must
  # partition the two directories the single combined invocation used to name,
  # and a leg naming `tests/integration` must be the leg that installs the
  # browser. A runtime `vitest list` gate like the Rust one has was measured
  # and rejected — one boot costs ~57s, four boots would cost more wall-clock
  # than this split saves.
  quality-tests:
    name: Quality vitest (${{ matrix.leg.label }})
    needs: changes
    # Same reasoning as the Chromium and vitest steps this replaced: a
    # Rust-only pull request has nothing for a browser or a test suite to run
    # against, and the skip keeps the required check green. An empty output
    # after a failed classification is unknown, and unknown runs the suites.
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    # The old 150-minute floor belonged to the job that also compiled Rust.
    # A hung vitest leg is caught by this cap in minutes.
    timeout-minutes: 45
    strategy:
      # A failed leg must not cancel its siblings' evidence.
      fail-fast: false
      matrix:
        leg:
          - label: unit 1/2
            args: "--pool=threads --shard=1/2 tests/unit"
            browser: "false"
          - label: unit 2/2
            args: "--pool=threads --shard=2/2 tests/unit"
            browser: "false"
          - label: integration
            args: "--pool=threads tests/integration"
            browser: "true"

    steps:
      # `fetch-depth: 0` is load-bearing, not cargo cult: the suite used to
      # run in the job that already had it, and `tests/unit/app-version.test.ts`
      # resolves the latest release tag with `git describe --abbrev=0 --tags`.
      # A default shallow checkout has no tags, and that test fails with
      # "fatal: No names found" — which is exactly how the split was caught.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      # `npm ci` is a dependency of `npx vitest`, and of the browser install.
      - name: Install frontend dependencies
        run: npm ci

      # The browser build is ~170 MB and the pinned Playwright version is what
      # selects it, so cache on the lockfile that pins that version: this leg
      # and `verify-smoke` restore the same Chromium instead of each
      # downloading it (issue #2046). Only the legs that declare `browser:
      # "true"` pay even the cache restore.
      - name: Cache the Playwright browser build
        if: ${{ matrix.leg.browser == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `tests/integration/ui-shot.test.ts` drives the fixture UI in headless
      # Chromium (scripts/ui-shot.mjs) — it launches a real browser rather than
      # mocking one, so the suite cannot pass on a runner without the pinned
      # browser build. A GitHub runner has none, and `launchChromium` throws
      # instead of skipping, so the leg installs it (issue #1520).
      # `npx playwright install` re-validates the cached revision and
      # re-downloads if it does not match, so a stale entry costs a download,
      # not a broken test run. `--with-deps` stays: the system libraries are
      # not files this cache can hold, and it is close to a no-op on a runner
      # that already has them.
      - name: Install Chromium for the UI screenshot tests
        if: ${{ matrix.leg.browser == 'true' }}
        run: npx playwright install --with-deps chromium

      # One vitest boot per leg over the files that leg owns. `--pool=threads`
      # is required; the default forks pool silently times out inside CI's
      # container and reports PASS(0) FAIL(0) exit 0, the same false-green we
      # hit in worktrees (issue #1257). The suite directory is explicit (no
      # `vitest run` default) so a new suite dir can't sneak in.
      - name: Run the ${{ matrix.leg.label }} vitest leg
        run: npx vitest run ${{ matrix.leg.args }}

  # The single Rust compile, shared by every downstream Rust job so a cold
  # target directory is paid for once instead of seven times. It starts as
  # soon as the change-scope job has classified the diff (it needs no frontend
  # output of its own) and publishes both the Cargo cache (rust-cache) and the
  # built mobile assets the shards and the bindings job consume. The Rust
  # *tests* do not run here: they live in `rust-tests` and `rust-bindings`,
  # which give every test a log that survives the runner-loss failure mode
  # this split was built for (issue #1520).
  rust-build:
    name: Rust build (compile)
    needs: changes
    # Starts only when the merge gate is in play (profile: full) and the
    # change-scope job reported that Rust moved. Skipping a job GitHub does
    # not require is harmless: required checks are only the three listed in
    # docs/development/releasing.md, and the `rust-bindings` job below keeps
    # the fail-closed guard for every other way this branch can be absent.
    if: inputs.profile == 'full' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # A cold, parallel compile and link of every test target, plus the pinned
    # Codex dispatch smoke. A lost runner is caught well before this cap.
    timeout-minutes: 90
    env:
      # `CARGO_BUILD_JOBS` is deliberately absent, and must stay absent. Cargo
      # defaults it to the runner's core count (4 on ubuntu-latest, measured by
      # the `nproc` below), so naming it here buys nothing — but rust-cache
      # hashes every `CARGO*`/`RUST*` variable into its cache key, so setting it
      # *only* here gave this job a different key from all seven shards and the
      # non-shard pass. Measured on run 38000250072: this job restored
      # `...-65c564bd-47ff76ef` and wrote its compile to that entry, while every
      # other Rust job restored `...-ecb08f1d-47ff76ef`. The shared entry the
      # compile was supposed to publish was therefore read by nobody: all eight
      # downstream jobs recompiled the crate anyway (~39s here, ~59s per shard).
      # The old `CARGO_BUILD_JOBS: "1"` was a memory-pressure workaround; the 8
      # GB swapfile below plus the lower-peak linker is the real fix, and cargo
      # already parallelises across the runner's four cores without being told.
      #
      # Debug symbols are the bulk of this crate's build output and buy a
      # pass/fail test run nothing. They also cost memory and link time.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # lld links a Tauri-sized binary with far less memory and time than the
      # default GNU ld, which is what makes the parallel build safe. Every Rust
      # job sets the identical flags so the shared Cargo cache stays valid and
      # no shard silently recompiles.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tauri 2 on Linux links against webkit2gtk-4.1, librsvg2, libayatana-
      # appindicator3, libxdo, OpenSSL, and (for RUSTFLAGS above) lld even when
      # running the Rust tests, so every job that compiles or runs the Rust
      # suite installs them.
      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Cache the expensive Linux test build once. The shards and the bindings
      # job restore this instead of rebuilding; the platform smoke jobs
      # deliberately do not persist OS-specific target directories.
      #
      # `shared-key` is what keeps that to *one* cache entry. By default
      # rust-cache keys on the job id, so the compile, the shards, and the
      # non-shard pass each saved their own ~590 MB copy of the same dependency
      # artifacts — nine jobs, and on a Cargo.lock bump every one of them a
      # fresh entry. The repository sits at 9.98 GB of GitHub's 10 GB cache
      # budget, so that duplication is what evicts the very entries that make
      # this job's compile 54s instead of minutes (issue #2046). One key means
      # one entry: the first job to finish saves it and the rest no-op.
      #
      # `shared-key` is necessary but NOT sufficient, and that is the trap this
      # step sat in until issue #2046's second pass. rust-cache also folds a
      # hash of every `CARGO*`/`RUST*` variable into the key, so two jobs only
      # share an entry when those match as well — and this job's env had one the
      # shards did not (`CARGO_BUILD_JOBS`). It still *reported* a hit, so nothing
      # failed: it saved `...-65c564bd-47ff76ef` while all eight downstream jobs
      # read `...-ecb08f1d-47ff76ef`, and each of them recompiled the crate. The
      # env blocks above are now identical across the three jobs and
      # `tests/agent-infra/rust-cache-key.test.mjs` fails the build if they drift.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: linux-rust-target

      # Record the runner's disk and memory budget, drop the image's unused
      # toolchains, and add swap. Uploaded as an artifact rather than only
      # printed: a runner that dies mid-build never flushes its log, which is
      # exactly how the first attempts of issue #1520 lost their evidence.
      - name: Prepare the runner (disk cleanup + swap)
        run: |
          {
            echo "=== before ==="
            df -h /
            free -h
            nproc
          } | tee runner-budget.txt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo fallocate -l 8G /mnt/buildmesh-swap || sudo dd if=/dev/zero of=/mnt/buildmesh-swap bs=1M count=8192 status=none
          sudo chmod 600 /mnt/buildmesh-swap
          sudo mkswap /mnt/buildmesh-swap
          sudo swapon /mnt/buildmesh-swap
          {
            echo "=== after image cleanup + swap ==="
            df -h /
            free -h
          } | tee -a runner-budget.txt

      - name: Upload the runner budget report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-build-runner-budget
          path: runner-budget.txt
          retention-days: 7

      # Only `dist/mobile` has to exist before the compile:
      # rust-embed folds it into the test binary
      # (`http::assets::tests::mobile_assets_include_built_index_html` reads
      # dist/mobile/index.html), and `npm run build:mobile` builds exactly it.
      # The desktop bundle is not needed here — `Quality gates (Linux)` runs
      # the full `npm run build` (tsc + both vite builds) and the required
      # `Quality (Linux)` gate needs it to succeed — and skipping it took a
      # measured 18s off this job's critical path (issue #2046). tauri-build
      # only registers `frontendDist` as a rebuild trigger when the directory
      # exists, and a debug-profile `generate_context!` does not embed assets
      # at compile time, so the missing desktop bundle cannot fail this build.
      - name: Build the mobile bundle
        run: npm run build:mobile

      - name: Compile the Rust test binaries
        run: cargo test --locked --no-run
        working-directory: src-tauri

      # The filters in the `rust-tests` matrix below are exact only for today's
      # test list, and libtest cannot express "first path segment is X", so a new
      # top-level module would silently go unrun. This gate lists the unit tests
      # from the test binary and fails if any is unclaimed or doubly claimed.
      #
      # It runs HERE, immediately after `--no-run`, and that placement is the
      # whole point: the listing needs the compiled binary, so it must not be the
      # step that pays to build it. It used to sit in `rust-nonshard`, ahead of
      # the fuzz smoke, where `cargo test --lib -- --list` compiled the crate
      # (56.6s on run 38000250072) and the fuzz smoke then compiled the *same*
      # target again (48.8s) — 105s of a 185s job to reach a test run of 0.3s.
      # Here the binary is already built, so the listing is a re-run of a warm
      # binary. Moving it also fails fast: a shard matrix that does not cover
      # the suite now fails before the seven shards are dispatched, instead of
      # after, and `rust-bindings` already requires this job, so the gate is
      # still on the merge path.
      - name: Verify the Rust shards cover every unit test
        run: node scripts/check-rust-shard-coverage.mjs

      # `http::assets::tests::mobile_assets_include_built_index_html` reads
      # dist/mobile/index.html, so the shards need the built output. Handing
      # it over as an artifact is much cheaper than a per-shard `npm ci` plus
      # mobile build, and it is already built here.
      - name: Upload the built mobile assets for the Rust shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-dist
          path: dist/mobile
          retention-days: 1

      # Manual runs additionally exercise the real CLI contract at a known
      # version. Regular PRs stay hermetic and use deterministic help-parser
      # coverage in the Rust suite. A release tag runs this workflow through
      # the `push` path and therefore skips both steps below — the release gate
      # is verification, not a live-CLI contract re-run.
      - name: Install pinned Codex CLI for proxy contract smoke
        if: github.event_name == 'workflow_dispatch'
        run: npm install --global @openai/codex@0.147.0

      - name: Verify pinned Codex profile routing on fresh and resume
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked pinned_codex_cli_loads_profile_for_fresh_and_resume -- --ignored
        working-directory: src-tauri

  # Issue #1520 — the Rust suite, sharded by module group.
  #
  # Seven runs of the first CI execution lost the hosted runner inside
  # `cargo test --lib`, every one of them with no step conclusion and no
  # retrievable log, so a single combined run cannot say which test did it: a
  # split into sequential steps only narrows it one step per hour-long cycle.
  # One job per module group instead means a lost runner costs exactly one
  # group, and every other shard keeps its log and its conclusion. `fail-fast:
  # false` for the same reason — a sibling's failure must not cancel the
  # evidence.
  #
  # Default thread count throughout: every DB-backed test installs a private
  # database for its own thread (issue #2048), so the suite is parallel-safe
  # and forcing one test at a time would only throw away the runner's cores.
  # The tested guard (scripts/ci/run-guarded.mjs) turns a hang into a step
  # failure with a log.
  #
  # Shard count re-evaluated after #2048, and deliberately left at seven. The
  # split was chosen when each shard ran its tests serially (the `services`
  # shard alone was ~100s); multi-threaded, the seven shards now measure
  # 13-39s each (~173s of test time in total, slowest
  # `git-env-preferences` at 39s). That puts per-shard setup (~30-50s of apt,
  # toolchain and cache restore) back on the critical path rather than the
  # tests, so consolidating into fewer, larger shards would *lengthen* the
  # critical path (~40s + 173/k) instead of shortening it. The #1520
  # property - a lost runner costs one group, not the suite - is also worth
  # more now that the groups are cheap. Revisit if the slowest shard grows
  # past the setup cost again.
  #
  # The job cap is the price of a lost runner: the guard below cannot fire on
  # a runner that is gone, so the job waits out `timeout-minutes` before the
  # CI retry can re-run it. The October 2026 `services` losses were this
  # shape for a specific reason: cancelling a verification shelled out to
  # procps `kill -KILL -<pid>`, and Ubuntu 24.04's kill keeps only the first
  # digit of a negative id. A pid starting with 1 becomes -1, which signals
  # every process the runner user can kill, including the runner agent, so
  # the guard never runs. `process_util::kill_process_group` calls kill(2)
  # with the whole id instead. At 40 minutes each of the five lost `services`
  # runners in October 2026 held its run for 45-60 minutes. A healthy shard
  # takes ~2 minutes including setup, and a cache miss that recompiles the
  # crate takes about as long as `rust-build` (3-7 minutes), so 15 minutes
  # still covers the slow honest case. tests/unit/ci-rust-timeout-guard.test.ts
  # pins the cap and keeps the guard's deadline plus kill grace inside it.
  rust-tests:
    name: Rust tests (${{ matrix.shard.label }})
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # These must stay *identical* to `rust-build`'s and `rust-nonshard`'s, and
      # that set is now exactly these four variables. Two separate things depend
      # on it: cargo's own fingerprint (a differing RUSTFLAGS or profile-debug
      # value forces every shard to recompile the crate the previous job just
      # built), and rust-cache's cache key, which hashes every `CARGO*`/`RUST*`
      # variable in the environment. A variable present here but absent in
      # `rust-build` splits the one shared entry into two and silently throws
      # away that job's compile — which is exactly what `CARGO_BUILD_JOBS` did
      # (issue #2046). `tests/agent-infra/rust-cache-key.test.mjs` gates the set
      # so the two jobs cannot drift apart again.
      #
      # No swapfile here, so these jobs must not raise their own link peak; they
      # normally only run the prebuilt binary anyway.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - label: db
            args: "db::"
          - label: services
            args: "services::"
          - label: agent
            args: "agent:: --skip commands::agent:: --skip models::agent::"
          - label: commands-http
            args: "commands:: http::"
          - label: circuit-coordinator
            args: "circuit:: coordinator:: --skip db::circuit:: --skip commands::circuit:: --skip models::circuit:: --skip commands::coordinator:: --skip http::routes::"
          - label: git-env-preferences
            args: "git:: env:: preferences:: --skip commands::git:: --skip commands::preferences:: --skip models::git::"
          # Everything whose first path segment no other shard owns, so a new
          # module lands in one place instead of going untested. The
          # `--skip agent::sandbox::` is the same nested-path problem the other
          # shards solve: `sandbox::` would otherwise also claim it.
          # `--skip commands::diagnostics::` is that same problem again: this
          # shard's `diagnostics::` filter is a substring of the `commands::`
          # command module added in #1525, so without the skip both this shard
          # and `commands-http` would claim those tests and the coverage gate
          # would fail. `commands::` (commands-http) keeps them.
          - label: remaining
            args: "attention_autoclear:: close_cancel_tests:: diagnostics:: instance_guard:: models:: node_turn:: process_util:: pty:: review_contract:: sandbox:: secret_scrubber:: session_capture:: session_naming:: startup:: windowing:: worktree_blockers:: --skip agent::sandbox:: --skip commands::diagnostics::"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Warm cache from `rust-build`, which compiled the same targets. The
      # shared key is `rust-build`'s: one entry for the whole Rust branch, so
      # seven shards do not each keep a private copy of the same artifacts
      # (issue #2046).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-rust-target

      - name: Restore the built mobile assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-dist
          path: dist/mobile

      - name: Run the ${{ matrix.shard.label }} tests
        env:
          # Point ts-rs away from the working tree. Every shard runs the same
          # lib test binary, so without this they would all rewrite
          # src/types/generated/ at once, and the drift gate would be reading
          # files seven jobs are writing. ts-rs joins the export dir onto the
          # test binary's working directory, and an absolute path replaces it
          # outright, so this lands outside the repository.
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs-${{ matrix.shard.label }}
        run: |
          # scripts/ci/run-guarded.mjs replaces the inline `timeout` shell
          # guard. It streams the command's output into this step's log
          # while appending it to the file the upload below preserves,
          # kills the command's whole process tree at the 10-minute
          # deadline (SIGTERM, then SIGKILL a minute later), emits the
          # annotation itself, and exits with the command's own code or 124
          # on the deadline. The guard is unit-tested
          # (tests/agent-infra/run-guarded.test.mjs), and because every
          # wait on the output pipes after the kill is itself bounded, a
          # descendant that escapes the process group while holding the
          # write end - the issue #1961 failure mode - cannot keep this
          # step alive past the guard, and a job-level cancel still leaves
          # a log behind.
          node "$GITHUB_WORKSPACE/scripts/ci/run-guarded.mjs" \
            --minutes 10 \
            --kill-grace-seconds 60 \
            --log "cargo-${{ matrix.shard.label }}.log" \
            --label "The ${{ matrix.shard.label }} shard" \
            -- cargo test --locked --lib -- ${{ matrix.shard.args }}
        working-directory: src-tauri

      - name: Upload the shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-shard-log-${{ matrix.shard.label }}
          path: src-tauri/cargo-${{ matrix.shard.label }}.log
          retention-days: 7
          if-no-files-found: warn

  # The non-unit Rust pass: ts-rs export (the single writer of the committed
  # bindings), doctests, every integration-test target, the shard-coverage
  # gate, and the binding drift check. It needs only the compiled cache, so it
  # runs beside the shards instead of after them: it is the longest Rust leg,
  # and queueing it behind the slowest shard added minutes to every Rust pull
  # request's critical path for no extra assurance. The required check is the
  # `rust-bindings` aggregate below, which fails closed unless this job, the
  # compile, every shard, and Quality all succeeded.
  rust-nonshard:
    name: Rust export, doc, and integration tests
    needs: [changes, rust-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same fingerprint inputs as `rust-build`/`rust-tests` so the restored
      # cache is reused for the export, doctest, and integration binaries
      # rather than rebuilt. Deliberately no `CARGO_BUILD_JOBS`: this job has no
      # swapfile, and the default keeps its extra links within the memory it
      # used before (lld only lowers that peak).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-rust-target

      - name: Restore the built mobile assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-dist
          path: dist/mobile

      # Issue #2156. The `http::fuzz` tests are already claimed by the
      # `commands-http` shard, so this adds no coverage — it is the explicit,
      # bounded invocation of the fuzz target, run with the campaign knobs
      # visible in the log. `--nocapture` puts the case count and seed it ran
      # with on the record; a campaign is a local command
      # (BUILDMESH_FUZZ_CASES), not CI time.
      - name: Smoke the HTTP request fuzz target
        env:
          BUILDMESH_FUZZ_CASES: "2000"
        run: |
          node "$GITHUB_WORKSPACE/scripts/ci/run-guarded.mjs" \
            --minutes 5 \
            --kill-grace-seconds 30 \
            --log cargo-http-fuzz.log \
            --label "The HTTP request fuzz smoke" \
            -- cargo test --locked --lib http::fuzz -- --nocapture
        working-directory: src-tauri

      # The matrix above runs every Rust unit test, and the coverage gate
      # verifies none were missed. Here, run the ts-rs export tests, doctests,
      # and every integration-test target; rerunning all unit tests serially
      # adds no coverage and can exceed the hosted-runner budget. No
      # TS_RS_EXPORT_DIR here, so the crate's own .cargo/config.toml applies
      # and the bindings land in src/types/generated/.
      - name: Run Rust export, documentation, and integration tests
        run: |
          # The same tested guard as the shards
          # (scripts/ci/run-guarded.mjs), at the 45-minute deadline this
          # pass has always had. The inner shell keeps `errexit` and
          # `pipefail`, so a failing export or integration target aborts
          # with that command's code; the guard reports it unchanged, or
          # 124 with an annotation if the pass hangs.
          node "$GITHUB_WORKSPACE/scripts/ci/run-guarded.mjs" \
            --minutes 45 \
            --kill-grace-seconds 120 \
            --log cargo-nonshard-tests.log \
            --label "Rust export, documentation, and integration tests" \
            -- bash -euo pipefail -c '
              cargo test --locked --lib export_bindings
              cargo test --locked --doc
              for test_file in tests/*.rs; do
                test_target="${test_file##*/}"
                test_target="${test_target%.rs}"
                cargo test --locked --test "$test_target"
              done
            '
        working-directory: src-tauri

      # The shards have always uploaded their log; this job did not, so a hang
      # here lost the only evidence it produced. Same `if: always()`, same
      # reason (issue #1961).
      - name: Upload the non-shard test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-nonshard-tests-log
          path: src-tauri/cargo-nonshard-tests.log
          retention-days: 7
          if-no-files-found: warn

      # The fuzz smoke's own log, uploaded separately because the upload above
      # is pinned to one filename by tests/unit/ci-rust-timeout-guard.test.ts:
      # a glob there would satisfy the intent and fail that test. A smoke
      # failure skips the export/integration step, so without this the one log
      # that explains it is also the one never written.
      - name: Upload the HTTP fuzz smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-http-fuzz-log
          path: src-tauri/cargo-http-fuzz.log
          retention-days: 7
          if-no-files-found: warn

      - name: Check Rust↔TS type bindings are up to date
        shell: bash
        run: |
          git add --intent-to-add src/types/generated
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test' in src-tauri/ and commit the changes under src/types/generated/."
            exit 1
          fi

  # The required Rust gate. It does no work of its own: it certifies that the
  # compile, every shard, the non-shard pass (with its binding drift check),
  # and Quality all succeeded. It keeps `if: always()` and an explicit result
  # check rather than relying on the implicit skip: a required status check
  # that is *skipped* counts as satisfied by GitHub, so a silently skipped
  # aggregate would be a hole in the merge gate. It fails instead.
  #
  # The one legitimate skip is a pull request that touched no Rust on a
  # successful change-scope classification - there is nothing for this job to
  # prove, and the check reports success as a skipped job does. Every other
  # absent input (change-scope failed, outputs missing, profile: light where
  # this check is not evaluated) keeps the job running so the guard below
  # fails with a reason instead.
  rust-bindings:
    name: Rust tests + TS bindings
    needs: [quality, rust-build, rust-tests, rust-nonshard, changes]
    if: always() && inputs.profile == 'full' && !(needs.changes.outputs.rust == 'false' && needs.changes.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The dependency results arrive as env vars, not through an expression:
      # GitHub's workflow validator rejects the `needs.*.result` wildcard
      # inside a function call (`join(needs.*.result, " ")` fails the whole file
      # with zero jobs), so read the jobs individually. A matrix dependency's
      # `result` is `success` only when every leg succeeded, which is the
      # aggregate this gate needs.
      - name: Refuse to pass unless every upstream gate succeeded
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_BUILD_RESULT: ${{ needs.rust-build.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          RUST_NONSHARD_RESULT: ${{ needs.rust-nonshard.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
        run: |
          # A classification that did not succeed leaves empty outputs, which
          # would otherwise read as "Rust did not change" and silently skip
          # the compile and the shards. Fail closed: no green Rust gate
          # without a successful change-scope classification behind it.
          if [ "$CHANGES_RESULT" != success ] || [ -z "$RUST_CHANGED" ]; then
            echo "::error::change-scope result=$CHANGES_RESULT rust='$RUST_CHANGED' - refusing to certify the Rust suite without a successful classification."
            exit 1
          fi
          if [ "$QUALITY_RESULT" != success ] || [ "$RUST_BUILD_RESULT" != success ] || [ "$RUST_TESTS_RESULT" != success ] || [ "$RUST_NONSHARD_RESULT" != success ]; then
            echo "::error::quality=$QUALITY_RESULT rust-build=$RUST_BUILD_RESULT rust-tests=$RUST_TESTS_RESULT rust-nonshard=$RUST_NONSHARD_RESULT - the Rust suite is not fully green."
            exit 1
          fi
          echo "rust=$RUST_CHANGED quality=$QUALITY_RESULT rust-build=$RUST_BUILD_RESULT rust-tests=$RUST_TESTS_RESULT rust-nonshard=$RUST_NONSHARD_RESULT"

  # Issue #1257 — the Playwright verify-smoke spec (issue #157) was
  # designed to run WITHOUT a Rust compile — it boots just Vite and
  # installs a JS-side Tauri mock before any app module evaluates.
  # Previously this CI never ran it, so the receiver-binding regression
  # class (#149 — bytes emitted but never reach xterm.js) had no
  # pre-merge gate. The job installs Chromium, runs only the
  # `verify-smoke` Playwright project, and stays well under 5 minutes.
  # Its only `needs` is the change-scope job, which costs a few seconds
  # and lets a Rust-only pull request skip a browser test with nothing to
  # test; gating it on any upstream *test* job would destroy the fast
  # feedback loop for a nothing-in-common dependency. It also doesn't
  # gate `platform-smoke` (the chromium project is far slower, depends on a
  # running buildmesh.exe, and stays a separate local-only contract per
  # CLAUDE.local.md).
  verify-smoke:
    name: Verify-smoke (Linux)
    needs: changes
    # Pushes and pull requests, as before (the weekly schedule still skips
    # it), and on pull requests only when the diff did not rule frontend
    # changes out: a skipped required check counts as satisfied, so a
    # Rust-only pull request reports this check green without booting a
    # browser it has nothing to test. An empty output after a failed
    # change-scope job is unknown, and unknown runs the browser.
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.frontend != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # The browser build is ~170 MB and the pinned Playwright version is what
      # selects it, so cache on the lockfile that pins that version: this job
      # and the vitest integration leg restore the same Chromium instead of
      # each downloading it (issue #2046). `npx playwright install`
      # re-validates the revision and re-downloads if it does not match, so a
      # stale entry costs a download, not a broken test run.
      - name: Cache the Playwright browser build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Issue #157 — verify-smoke installs Chromium with its system
      # dependencies (libnss3, libatk-bridge2.0-0, etc.) so the headless
      # browser can render xterm.js + the React app. --with-deps is a
      # no-op on hosts that already have the libs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The Playwright config's top-level `webServer` (see
      # playwright.config.ts) boots `npm run dev` (just Vite) and waits
      # for :1420 to be reachable before running the spec, so no manual
      # dev-server start is needed here. `--project=verify-smoke`
      # excludes the chromium project which would need a real
      # buildmesh.exe on :1991.
      - name: Run verify-smoke Playwright project
        run: npx playwright test --project=verify-smoke --reporter=line

      # Surface trace + test-results on failure. `--reporter=line`
      # intentionally hides what happened; without this artifact a
      # red CI run leaves zero visibility into the spec failure.
      - name: Upload Playwright report / trace
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-verify-smoke-report
          path: test-results/
          retention-days: 7

  # Compiles and links the real Tauri app on the two remaining hosts, including
  # the frontend `beforeBuildCommand`, without spending time or storage on
  # transient installers. Not a merge gate: the ruleset's required checks are
  # Quality, Rust tests + TS bindings, and Verify-smoke (see
  # docs/development/releasing.md), so paying for two cold cross-OS builds on
  # every pull request buys no gating power - the Linux compile in `rust-build`
  # covers the merge. The cross-OS signal still matters where it is cheap to
  # act on: pushes to main (the post-merge `light` profile still runs these),
  # the tagged release SHA (release.yml invokes this workflow as a push event),
  # and manual dispatches. The weekly schedule keeps skipping them in favor of
  # `Weekly package smoke`, which builds installers on all three platforms.
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    env:
      # No debug symbols in the smoke binary — it proves the app compiles and
      # links, and the ConPTY test reads no symbols. Roughly halves the Windows
      # link, which is the slow part of this post-merge job.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    # A failure on one operating system must not hide a regression on the
    # other. Linux compilation and linking are covered by `rust-build`.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # Keep the Cargo download cache; persist target directories on Windows only
      # (issue #2046). This was the slowest job in the repository — 573s on a
      # push to main, 326s of it a cold Tauri compile — and it delays the
      # post-merge signal. Two reasons this is safe rather than a multi-GB
      # target directory dumped into a 10 GB repository budget: rust-cache
      # stores *dependency* artifacts only and never the workspace crate, so
      # the entry is about the size of the Linux one (~590 MB); and its key
      # already contains the runner OS, so this cannot collide with, or evict,
      # the Linux entry the merge gate depends on.
      #
      # macOS stays deliberately cold: the cache action documents macOS target
      # directories as its corruption workaround, its smoke is 245s, and the
      # budget is better spent on the leg that was 535s. The `false` is
      # deliberate rather than an oversight.
      - name: Cache Cargo registry (and the Windows target)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: ${{ matrix.os == 'windows-latest' }}

      - name: Install frontend dependencies
        run: npm ci

      # Compile and link the real Tauri application on each remaining host,
      # including the frontend beforeBuildCommand, without spending time or
      # storage on transient installers. Tagged releases remain authoritative.
      - name: Compile Tauri app without installers
        run: npm run tauri build -- --debug --no-bundle

      # Both Windows-only contracts in ONE `cargo test` invocation. They were two
      # steps, and that cost a full recompile of the crate: each `cargo test
      # --lib <filter>` in this job rebuilt `buildmesh_lib` from scratch — 1m33s
      # for the first filter and 1m27s for the second on run 38000860311 — to run
      # 2 and 15 tests that take under 5s in total. libtest ORs its positional
      # filters, so one invocation selects exactly the same 17 tests and pays the
      # link once. The two contracts stay separately named in the output because
      # libtest prints every test it runs.
      #
      # The `--` is load-bearing, not decoration. `cargo test` takes a single
      # positional `[TESTNAME]`; a second bare filter is rejected by cargo before
      # anything builds ("error: unexpected argument 'agent::background::tests'
      # found"). Filters for libtest must sit after the separator, where cargo
      # stops parsing and forwards them to the test binary. An earlier revision of
      # this step omitted it and only failed on `main`, because `platform-smoke`
      # runs post-merge and on manual dispatch, never on a pull request.
      - name: Verify the Windows-only Rust contracts
        if: runner.os == 'Windows'
        run: cargo test --locked --lib -- conpty_preserves_synchronized_cursor_frames agent::background::tests
        working-directory: src-tauri
