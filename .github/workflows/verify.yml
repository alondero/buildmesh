name: Verify

# The merge gate and the release gate, in one place (issue #1520).
#
# `build.yml` calls this workflow for every push to `main`, every pull request,
# and the weekly schedule; `release.yml` calls it again for the tagged SHA
# before it builds or uploads anything. Publishing from an unverified commit is
# therefore structurally impossible: the `release` job `needs` this workflow.
#
# Keeping the jobs here (rather than in `build.yml`) means the required job
# names below are literally the same checks `main` requires and the ones a
# release tag is verified by. The names are part of the branch-protection
# ruleset, so renaming one here is a policy change: update the ruleset and
# docs/development/releasing.md in the same commit.
#
# The jobs form a fan-out, not a chain. `quality` (frontend), `rust-build` (the
# single Rust compile), and both `platform-smoke` jobs start at t=0; the seven
# `rust-tests` shards start as soon as `rust-build` is ready, and the
# `rust-bindings` aggregate starts once `quality`, `rust-build`, and every shard
# have finished. Nothing waits behind one ~10-minute monolith any more: a runner
# that takes a few minutes to be handed over delays only its own branch of the
# graph, not every job behind it.
#
# Job event guards use the *caller's* event name, which is what keeps the
# weekly schedule off the browser job: a scheduled run skips `verify-smoke` and
# `platform-smoke`, both gated to push/pull_request.
on:
  workflow_call:

# Least privilege: this workflow only ever checks out code and runs the test,
# lint, docs, and compile gates. Nothing here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The fast, frontend-only gate — the first result a PR hears back from. It
  # deliberately no longer compiles Rust: that moved to `rust-build`, so the
  # Rust shards and both platform-smoke jobs no longer wait behind it. The
  # required status-check name is owned by branch protection
  # (docs/development/releasing.md), so this job keeps the `Quality (Linux)`
  # name and its aggregate meaning.
  quality:
    name: Quality (Linux)
    runs-on: ubuntu-latest
    # A backstop above the real work (npm ci, the static gates, the frontend
    # build, Chromium, and the vitest suites). It no longer contains the Rust
    # compile, so the old 150-minute floor — sized around a lost-runner hang in
    # `cargo test` — is unnecessary: a hung step here is caught far sooner.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      # `npm ci` must precede every step that loads a dependency. `test:lint`
      # runs the ESLint fixture verifier in-process, and on a clean runner it
      # died with ERR_MODULE_NOT_FOUND for 'eslint' when this step sat below it
      # (issue #1520). Cheap gates first, expensive build after.
      - name: Install frontend dependencies
        run: npm ci

      - name: Check agent infrastructure and changed-code rules
        env:
          AGENT_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          # test:agent runs check-agent-diff; test:readme runs the
          # README drift gate's in-memory tests; test:lint runs the
          # lint-fixtures verifier's in-memory tests. Invoking the npm
          # scripts explicitly (instead of a `tests/agent-infra/*.test.mjs`
          # glob) keeps CI in lock-step with what `scripts/check.ps1`
          # invokes locally.
          npm run test:agent
          npm run test:docs
          npm run test:readme
          npm run test:lint
          base="$AGENT_DIFF_BASE"
          if [[ "$base" =~ ^0+$ ]]; then base=HEAD; fi
          node scripts/check-agent-diff.mjs --base "$base"

      # Issue #1545 ??? gate the README against drift in the Provider enum
      # count, supported-platforms claim, SmartScreen warning, and the
      # CLAUDE.md "no internal issue numbers in user-facing docs" rule.
      # Cheap (no build), runs in ~50ms; safe to add at the top of the
      # job so a stale landing page fails before any build starts.
      - name: Check README drift (issue #1545)
        run: npm run check:readme

      - name: Check documentation contract
        env:
          DOCS_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          base="$DOCS_DIFF_BASE"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=HEAD; fi
          if git rev-parse --verify --end-of-options "${base}^{commit}" >/dev/null 2>&1; then
            node scripts/check-docs.mjs --base "$base"
          else
            echo "::warning::Documentation impact diff base '$base' is unavailable; running the structural documentation check only."
            node scripts/check-docs.mjs
          fi

      # Issue #1542 ??? enforced ESLint + React Hooks gate. Two steps:
      #  (a) `npm run lint` runs ESLint across the codebase; the flat
      #      config excludes `src/types/generated/**`, `dist/**`, the
      #      agent working dir, docs, and the lint-fixtures dir so a
      #      clean checkout passes. Catches conditional-hook crashes
      #      (closed #1242 was a real one) before they ship.
      #  (b) `npm run lint:fixtures` runs ESLint against the two
      #      intentional-violation fixtures and asserts each one trips
      #      its target rule. This is the inverse of (a) ??? it must
      #      succeed (the gate is live), proving a future rule tweak
      #      that accidentally silences React Hooks would fail CI.
      # Run before the build so a syntax-level regression trips in
      # seconds rather than waiting for tsc + vite.
      - name: ESLint gate (issue #1542)
        run: npm run lint

      - name: ESLint fixtures verifier (issue #1542)
        run: npm run lint:fixtures

      # Typecheck the frontend against the committed bindings and build the
      # desktop + mobile bundles the budget gate below measures. `npm run build`
      # runs `tsc` itself, so this step is just `npm run build` (no separate
      # `tsc --noEmit`).
      - name: Build desktop + mobile bundles
        run: npm run build

      # Issue #1568 - gate the desktop initial JS/CSS bundles against the
      # documented budget in `scripts/bundle-budget.json`. The script exits
      # non-zero on a breach so a regression on the entry chunk becomes a
      # red build instead of a hidden cost on first paint. We run it here
      # (after the build) rather than inside the test step because the
      # budget applies to release artifacts, not the dev server.
      - name: Check desktop initial bundle budget (issue #1568)
        run: npm run check:bundle

      # `tests/integration/ui-shot.test.ts` drives the fixture UI in headless
      # Chromium (scripts/ui-shot.mjs) ??? it launches a real browser rather
      # than mocking one, so the suite cannot pass on a runner without the
      # pinned browser build. A GitHub runner has none, and `launchChromium`
      # throws instead of skipping, so the job installs it here (issue #1520).
      - name: Install Chromium for the UI screenshot tests
        run: npx playwright install --with-deps chromium

      # Single invocation runs both unit and integration suites in the
      # same vitest worker-pool boot (cheaper than two separate calls
      # which each start node + transform every module twice). Issue #1257
      # ??? --pool=threads is required; the default forks pool silently
      # times out inside CI's container and reports PASS(0) FAIL(0) exit
      # 0, the same false-green we hit in worktrees. Tests scope is
      # explicit (no `vitest run` default) so a new suite dir can't sneak
      # in.
      - name: Run vitest test suite (unit + integration)
        run: npx vitest run --pool=threads tests/unit tests/integration

      # Fail CI if any code path spawns `git` via bare `Command::new("git")`
      # or sets `creation_flags` inline. Only process_util may own those details.
      # Node-only, so it lives in the fast frontend gate rather than the compile.
      - name: Verify no inline process-spawn patterns outside process_util (gh665/gh690)
        run: node scripts/check-process-spawn-discipline.mjs

  # The single Rust compile, shared by every downstream Rust job so a cold
  # target directory is paid for once instead of seven times. It starts at t=0
  # (it needs no frontend output of its own) and publishes both the Cargo cache
  # (rust-cache) and the built mobile assets the shards and the bindings job
  # consume. The Rust *tests* do not run here: they live in `rust-tests` and
  # `rust-bindings`, which give every test a log that survives the runner-loss
  # failure mode this split was built for (issue #1520).
  rust-build:
    name: Rust build (compile)
    runs-on: ubuntu-latest
    # A cold, parallel compile and link of every test target, plus the pinned
    # Codex dispatch smoke. A lost runner is caught well before this cap.
    timeout-minutes: 90
    env:
      # Four crates compile concurrently instead of one. The old
      # `CARGO_BUILD_JOBS: "1"` was a blunt workaround for the hosted runner
      # losing communication with the server under memory pressure; an 8 GB
      # swapfile (created below) plus a lower-peak linker is the real fix, and
      # this job is not on an interactive path either way.
      CARGO_BUILD_JOBS: "4"
      # Debug symbols are the bulk of this crate's build output and buy a
      # pass/fail test run nothing. They also cost memory and link time.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # lld links a Tauri-sized binary with far less memory and time than the
      # default GNU ld, which is what makes the parallel build safe. Every Rust
      # job sets the identical flags so the shared Cargo cache stays valid and
      # no shard silently recompiles.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri 2 on Linux links against webkit2gtk-4.1, librsvg2, libayatana-
      # appindicator3, libxdo, OpenSSL, and (for RUSTFLAGS above) lld even when
      # running the Rust tests, so every job that compiles or runs the Rust
      # suite installs them.
      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache the expensive Linux test build once. The shards and the bindings
      # job restore this instead of rebuilding; the platform smoke jobs
      # deliberately do not persist OS-specific target directories.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Record the runner's disk and memory budget, drop the image's unused
      # toolchains, and add swap. Uploaded as an artifact rather than only
      # printed: a runner that dies mid-build never flushes its log, which is
      # exactly how the first attempts of issue #1520 lost their evidence.
      - name: Prepare the runner (disk cleanup + swap)
        run: |
          {
            echo "=== before ==="
            df -h /
            free -h
            nproc
          } | tee runner-budget.txt
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo fallocate -l 8G /mnt/buildmesh-swap || sudo dd if=/dev/zero of=/mnt/buildmesh-swap bs=1M count=8192 status=none
          sudo chmod 600 /mnt/buildmesh-swap
          sudo mkswap /mnt/buildmesh-swap
          sudo swapon /mnt/buildmesh-swap
          {
            echo "=== after image cleanup + swap ==="
            df -h /
            free -h
          } | tee -a runner-budget.txt

      - name: Upload the runner budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-runner-budget
          path: runner-budget.txt
          retention-days: 7

      # tauri-build validates `frontendDist` (../dist) and the Rust suite embeds
      # dist/mobile, so both bundles must exist before the compile. `npm run
      # build` runs tsc + vite + vite --mode mobile.
      - name: Build desktop + mobile bundles
        run: npm run build

      - name: Compile the Rust test binaries
        run: cargo test --locked --no-run
        working-directory: src-tauri

      # `http::assets::tests::mobile_assets_include_built_index_html` reads
      # dist/mobile/index.html, so the shards need the built output. Handing
      # it over as an artifact is much cheaper than a per-shard `npm ci` plus
      # mobile build, and it is already built here.
      - name: Upload the built mobile assets for the Rust shards
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist
          path: dist/mobile
          retention-days: 1

      # Manual runs additionally exercise the real CLI contract at a known
      # version. Regular PRs stay hermetic and use deterministic help-parser
      # coverage in the Rust suite. A release tag runs this workflow through
      # the `push` path and therefore skips both steps below ??? the release gate
      # is verification, not a live-CLI contract re-run.
      - name: Install pinned Codex CLI for proxy contract smoke
        if: github.event_name == 'workflow_dispatch'
        run: npm install --global @openai/codex@0.147.0

      - name: Verify pinned Codex profile routing on fresh and resume
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked pinned_codex_cli_loads_profile_for_fresh_and_resume -- --ignored
        working-directory: src-tauri

  # Issue #1520 ??? the Rust suite, sharded by module group.
  #
  # Seven runs of the first CI execution lost the hosted runner inside
  # `cargo test --lib`, every one of them with no step conclusion and no
  # retrievable log, so a single combined run cannot say which test did it: a
  # split into sequential steps only narrows it one step per hour-long cycle.
  # One job per module group instead means a lost runner costs exactly one
  # group, and every other shard keeps its log and its conclusion. `fail-fast:
  # false` for the same reason ??? a sibling's failure must not cancel the
  # evidence.
  #
  # `--test-threads=1` throughout: CLAUDE.md documents the `db::` tests as
  # sharing one process-global database and reporting phantom failures (and
  # wedging) in parallel, and a gate that cries wolf trains people to re-run
  # it. The in-shell `timeout` turns a hang into a step failure with a log.
  rust-tests:
    name: Rust tests (${{ matrix.shard.label }})
    needs: rust-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Only the compiler *fingerprint* inputs need to match `rust-build` (which
      # owns the compile): a differing RUSTFLAGS or profile-debug value forces
      # every shard to recompile the crate the previous job just built.
      # `CARGO_BUILD_JOBS` is deliberately absent — it is not a fingerprint
      # input, the shards normally only run the prebuilt binary, and they have
      # no swapfile, so they must not raise their own link peak.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    strategy:
      fail-fast: false
      matrix:
        shard:
          - label: db
            args: "db::"
          - label: services
            args: "services::"
          - label: agent
            args: "agent:: --skip commands::agent:: --skip models::agent::"
          - label: commands-http
            args: "commands:: http::"
          - label: circuit-coordinator
            args: "circuit:: coordinator:: --skip db::circuit:: --skip commands::circuit:: --skip models::circuit:: --skip commands::coordinator:: --skip http::routes::"
          - label: git-env-preferences
            args: "git:: env:: preferences:: --skip commands::git:: --skip commands::preferences:: --skip models::git::"
          # Everything whose first path segment no other shard owns, so a new
          # module lands in one place instead of going untested. The
          # `--skip agent::sandbox::` is the same nested-path problem the other
          # shards solve: `sandbox::` would otherwise also claim it.
          - label: remaining
            args: "attention_autoclear:: close_cancel_tests:: diagnostics:: models:: node_turn:: process_util:: pty:: sandbox:: secret_scrubber:: session_capture:: session_naming:: windowing:: --skip agent::sandbox::"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Warm cache from `rust-build`, which compiled the same targets.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Restore the built mobile assets
        uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: dist/mobile

      - name: Run the ${{ matrix.shard.label }} tests
        env:
          # Point ts-rs away from the working tree. Every shard runs the same
          # lib test binary, so without this they would all rewrite
          # src/types/generated/ at once, and the drift gate would be reading
          # files seven jobs are writing. ts-rs joins the export dir onto the
          # test binary's working directory, and an absolute path replaces it
          # outright, so this lands outside the repository.
          TS_RS_EXPORT_DIR: ${{ runner.temp }}/ts-rs-${{ matrix.shard.label }}
        run: |
          # The log is written by redirection, never through a pipe
          # (issue #1961). `timeout` signals the process group it starts, but
          # a test's descendant can leave that group while still holding the
          # pipe's write end, so `tee` never sees EOF and the step does not
          # return: the `services` shard ran ~45 minutes that way, past both
          # this 30-minute guard and the job cap, and a cancelled job flushes
          # no log, so it produced no evidence either. With a redirect nothing
          # sits between the test and this shell, the guard ends the step, and
          # the upload step below still gets the same file.
          log="cargo-${{ matrix.shard.label }}.log"
          # GitHub runs a `run:` block under `bash -e`, so a bare `timeout`
          # that fails ends the step on the spot: the status capture, the
          # `cat`, and the annotation below would all be skipped, and a hung
          # shard would fail with an empty step log and no explanation.
          # Initialising the status and consuming `timeout`'s own failure with
          # `||` keeps those lines reachable on both paths; the step still
          # exits with the guarded command's code. Do not "simplify" the `||`.
          status=0
          timeout --kill-after=2m 30m \
            cargo test --locked --lib -- --test-threads=1 ${{ matrix.shard.args }} > "$log" 2>&1 || status=$?
          # Printing the log keeps the step's own output as readable as the
          # pipeline was; for a hung shard its tail is the main clue.
          cat "$log"
          if [ "$status" = 124 ]; then
            echo "::error::The ${{ matrix.shard.label }} shard exceeded 30 minutes and was killed ??? a test in it is hanging."
          fi
          exit "$status"
        working-directory: src-tauri

      - name: Upload the shard log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-shard-log-${{ matrix.shard.label }}
          path: src-tauri/cargo-${{ matrix.shard.label }}.log
          retention-days: 7
          if-no-files-found: warn

  # The authoritative Rust pass: every target, in one process, with the real
  # export directory, so ts-rs regenerates the committed bindings and the
  # drift gate has a single writer. Runs only once the compile and every shard
  # have passed, and `if: always()` with an explicit result check rather than
  # relying on the implicit skip: a required status check that is *skipped*
  # counts as satisfied by GitHub, so a silently skipped aggregate would be a
  # hole in the merge gate. It fails instead.
  rust-bindings:
    name: Rust tests + TS bindings
    needs: [quality, rust-build, rust-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same fingerprint inputs as `rust-build`/`rust-tests` so the restored
      # cache is reused for the export, doctest, and integration binaries
      # rather than rebuilt. Deliberately no `CARGO_BUILD_JOBS`: this job has no
      # swapfile, and the default keeps its extra links within the memory it
      # used before (lld only lowers that peak).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      # Fail closed, and say why in the run rather than letting a skipped job
      # read as success. GitHub counts a *skipped* required status check as
      # satisfied, so an aggregate that silently skips when a shard fails would
      # be a hole in the merge gate; this job always runs and fails instead.
      #
      # The dependency results arrive as env vars, not through an expression:
      # GitHub's workflow validator rejects the `needs.*.result` wildcard
      # inside a function call (`join(needs.*.result, " ")` fails the whole file
      # with zero jobs), so read the jobs individually. A matrix dependency's
      # `result` is `success` only when every leg succeeded, which is the
      # aggregate this gate needs.
      - name: Refuse to run unless every upstream gate succeeded
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUST_BUILD_RESULT: ${{ needs.rust-build.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: |
          if [ "$QUALITY_RESULT" != success ] || [ "$RUST_BUILD_RESULT" != success ] || [ "$RUST_TESTS_RESULT" != success ]; then
            echo "::error::quality=$QUALITY_RESULT rust-build=$RUST_BUILD_RESULT rust-tests=$RUST_TESTS_RESULT — the Rust suite is not fully green, so the authoritative pass is not running."
            exit 1
          fi
          echo "quality=$QUALITY_RESULT rust-build=$RUST_BUILD_RESULT rust-tests=$RUST_TESTS_RESULT"

      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/install-linux-build-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Restore the built mobile assets
        uses: actions/download-artifact@v4
        with:
          name: mobile-dist
          path: dist/mobile

      # The filters above are exact only for today's test list, and libtest
      # cannot express "first path segment is X", so a new top-level module
      # would silently go unrun. This gate lists the unit tests from the test
      # binary and fails if any is unclaimed or doubly claimed.
      - name: Verify the Rust shards cover every unit test
        run: node scripts/check-rust-shard-coverage.mjs

      # The matrix above runs every Rust unit test, and the coverage gate
      # verifies none were missed. Here, run the ts-rs export tests, doctests,
      # and every integration-test target; rerunning all unit tests serially
      # adds no coverage and can exceed the hosted-runner budget. No
      # TS_RS_EXPORT_DIR here, so the crate's own .cargo/config.toml applies
      # and the bindings land in src/types/generated/.
      - name: Run Rust export, documentation, and integration tests
        run: |
          # Redirection rather than a tee pipeline, for the same reason as the
          # shards (issue #1961): a descendant that leaves `timeout`'s process
          # group keeps the pipe open, so the step outlives the guard meant to
          # end it. The inner script keeps its own `pipefail`; only the outer
          # pipeline plumbing is gone.
          log=cargo-nonshard-tests.log
          # Same errexit-safe capture as the shards: under `bash -e` a bare
          # `timeout` would skip the `cat` and the annotation on failure.
          status=0
          timeout --kill-after=2m 45m bash -euo pipefail -c '
            cargo test --locked --lib export_bindings -- --test-threads=1
            cargo test --locked --doc -- --test-threads=1
            for test_file in tests/*.rs; do
              test_target="${test_file##*/}"
              test_target="${test_target%.rs}"
              cargo test --locked --test "$test_target" -- --test-threads=1
            done
          ' > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" = 124 ]; then
            echo "::error::Rust export, documentation, and integration tests exceeded 45 minutes."
          fi
          exit "$status"
        working-directory: src-tauri

      # The shards have always uploaded their log; this job did not, so a hang
      # here lost the only evidence it produced. Same `if: always()`, same
      # reason (issue #1961).
      - name: Upload the non-shard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-nonshard-tests-log
          path: src-tauri/cargo-nonshard-tests.log
          retention-days: 7
          if-no-files-found: warn

      - name: Check Rust???TS type bindings are up to date
        shell: bash
        run: |
          git add --intent-to-add src/types/generated
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test' in src-tauri/ and commit the changes under src/types/generated/."
            exit 1
          fi

  # Issue #1257 ??? the Playwright verify-smoke spec (issue #157) was
  # designed to run WITHOUT a Rust compile ??? it boots just Vite and
  # installs a JS-side Tauri mock before any app module evaluates.
  # Previously this CI never ran it, so the receiver-binding regression
  # class (#149 ??? bytes emitted but never reach xterm.js) had no
  # pre-merge gate. The job installs Chromium, runs only the
  # `verify-smoke` Playwright project, and stays well under 5 minutes.
  # Intentionally has no `needs` ??? verify-smoke is a lightweight frontend
  # test with a mock backend; gating it on any upstream job destroys the
  # fast feedback loop for a nothing-in-common dependency. It also doesn't
  # gate `platform-smoke` (the chromium project is far slower, depends on a
  # running buildmesh.exe, and stays a separate local-only contract per
  # CLAUDE.local.md).
  verify-smoke:
    name: Verify-smoke (Linux)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # Issue #157 ??? verify-smoke installs Chromium with its system
      # dependencies (libnss3, libatk-bridge2.0-0, etc.) so the headless
      # browser can render xterm.js + the React app. --with-deps is a
      # no-op on hosts that already have the libs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The Playwright config's top-level `webServer` (see
      # playwright.config.ts) boots `npm run dev` (just Vite) and waits
      # for :1420 to be reachable before running the spec, so no manual
      # dev-server start is needed here. `--project=verify-smoke`
      # excludes the chromium project which would need a real
      # buildmesh.exe on :1991.
      - name: Run verify-smoke Playwright project
        run: npx playwright test --project=verify-smoke --reporter=line

      # Surface trace + test-results on failure. `--reporter=line`
      # intentionally hides what happened; without this artifact a
      # red CI run leaves zero visibility into the spec failure.
      - name: Upload Playwright report / trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-verify-smoke-report
          path: test-results/
          retention-days: 7

  # Compiles and links the real Tauri app on the two remaining hosts, including
  # the frontend `beforeBuildCommand`, without spending time or storage on
  # transient installers. Starts at t=0 alongside `quality` — it consumes
  # nothing from it — so a queue delay on the frontend gate no longer pushes
  # these required checks off the end of the run.
  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      # No debug symbols in the smoke binary — it proves the app compiles and
      # links, and the ConPTY test reads no symbols. Roughly halves the Windows
      # link, which is on the per-PR critical path.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    # A failure on one operating system must not hide a regression on the
    # other. Linux compilation and linking are covered by `rust-build`.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the Cargo download cache but do not retain an OS-specific target
      # directory for these smoke builds.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-targets: false

      - name: Install frontend dependencies
        run: npm ci

      # Compile and link the real Tauri application on each remaining host,
      # including the frontend beforeBuildCommand, without spending time or
      # storage on transient installers. Tagged releases remain authoritative.
      - name: Compile Tauri app without installers
        run: npm run tauri build -- --debug --no-bundle

      - name: Verify Windows ConPTY frame ordering
        if: runner.os == 'Windows'
        run: cargo test --locked --lib conpty_preserves_synchronized_cursor_frames -- --test-threads=1
        working-directory: src-tauri
