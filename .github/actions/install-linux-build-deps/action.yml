name: Install Tauri Linux build dependencies
description: >-
  Apt packages the Rust test binaries need to link and load on ubuntu-latest.
  Tauri 2 on Linux links against webkit2gtk-4.1, librsvg2,
  libayatana-appindicator3, libxdo, and OpenSSL even when the code under test is
  a unit test, so every job that compiles or runs the Rust suite needs this —
  not just the one that produces the Cargo cache. Verified on Actions: a Rust
  job without it fails to load the test binary. `lld` backs the Rust jobs'
  `RUSTFLAGS=-C link-arg=-fuse-ld=lld`, which links a Tauri-sized binary with
  far less memory and time than GNU ld.

  Nine jobs per Rust pull request pay this step (the compile, seven shards, and
  the non-shard pass), so the .deb set is cached and apt unpacks it instead of
  re-downloading it every time (issue #2046). The set is about 200 packages and
  68-78 MB on Ubuntu 26.04 depending on the runner image, which is why a cache
  that does not work is not a small inefficiency but the whole setup cost.

inputs:
  update-timeout-minutes:
    description: >-
      Deadline for `apt-get update`, in minutes. The index is ~3 MB and took
      1-8s on every measured run, so this is a stall detector rather than a
      budget: a mirror that crawls fails the step with a diagnostic instead of
      eating the job's whole cap.
    default: '5'
  resolve-timeout-minutes:
    description: >-
      Deadline for resolving the package set, in minutes. The resolution reads
      the index apt has just fetched and works out which .deb the install
      wants; it took 3.58s on run 39810991041, so this is a backstop for a
      resolver that stops making progress, not a budget.
    default: '2'
  install-timeout-minutes:
    description: >-
      Deadline for `apt-get install`, in minutes. This is the number the
      calling job's budget is computed from, so it has to be an input rather
      than a literal in the shell below: a job that may have to download the
      whole set needs a different one from a job whose cache entry is already
      warm.
    default: '20'

runs:
  using: composite
  steps:
    # The download half of `apt-get install` is the expensive half, and it is
    # the same set of packages in all nine jobs. Point apt's own archive cache
    # at a workspace directory so the .debs it downloads survive the job as an
    # actions/cache entry.
    #
    # The key names the *package set*, not this file. `apt-get install
    # --print-uris` resolves the install without fetching anything and lists
    # the .deb it would download, and the digest of those filenames identifies
    # the set: an entry under that key holds those files, and an entry under
    # any other key holds a different set.
    #
    # The key used to be the hash of this file, which changed only when
    # somebody edited it and therefore could not tell one Ubuntu release from
    # another. The `ubuntu-latest` image moved from 24.04 to 26.04 in October
    # 2026, and the entry the old image left behind was restored as a *hit*:
    # 135 MB restored, 77.7 MB downloaded again, and apt's own "Need to get"
    # and "Fetched" figures matched, so none of the restored files was
    # reused — in every one of the nine jobs on run 39777829786. The release
    # codename is in the key for the same reason: an entry from another
    # release is a different set, not a partial hit.
    #
    # `restore-keys` falls back to the newest entry of the same release, so a
    # package version that moved between two jobs costs the difference rather
    # than the whole set. apt matches a cached .deb against the version its
    # index wants and downloads only what is missing, so a stale entry inside
    # one release is a near-hit.
    #
    # This is apt's own supported mechanism, not an extracted-file
    # reconstruction: apt still resolves and verifies every package and runs
    # its maintainer scripts on a hit — only the transfer is skipped.
    - name: Update the package index and resolve the package set
      id: package-set
      shell: bash
      env:
        UPDATE_TIMEOUT_MINUTES: ${{ inputs.update-timeout-minutes }}
        RESOLVE_TIMEOUT_MINUTES: ${{ inputs.resolve-timeout-minutes }}
      run: |
        # `Dir::Cache::archives` is where apt keeps downloaded .debs by default
        # (/var/cache/apt/archives, which no runner persists between jobs).
        # Redirecting it is the whole cache: on a hit apt still resolves and
        # verifies every package and runs its maintainer scripts — it only
        # skips the transfer. `APT::Sandbox::User=root` keeps the unprivileged
        # _apt downloader from needing write access to the workspace directory
        # this cache restores into.
        APT_OPTS=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Dir::Cache::archives="$GITHUB_WORKSPACE/.ci-apt-archives"
          -o APT::Sandbox::User=root
        )
        mkdir -p "$GITHUB_WORKSPACE/.ci-apt-archives/partial"

        # The package list is defined once, here, and handed to the install
        # step through the environment. Two copies would drift, and the
        # resolved set would then name packages the install never asks for —
        # a cache key that never matches anything.
        APT_PACKAGES="build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev lld patchelf wget"
        echo "APT_PACKAGES=$APT_PACKAGES" >> "$GITHUB_ENV"

        # A flaky mirror must fail the step, not burn the job cap in silence:
        # attempt 1 of run 36885525121 crawled through `apt-get update` for
        # seven minutes and then sat on a stalled download until the job was
        # cancelled. `Acquire::Retries` re-tries transient fetch failures and
        # the `Timeout` options cap each connection attempt, so a genuinely
        # wedged mirror fails on its own. The `sudo timeout` deadlines are the
        # backstop for a run that is still progressing too slowly. When a
        # deadline does fire, say so in the step log instead of leaving a bare
        # 124 — and fire it *before* the job cap, so the failure is this
        # message rather than a cancelled job with no diagnosis.
        rc=0
        sudo timeout --kill-after=30s "${UPDATE_TIMEOUT_MINUTES}m" apt-get "${APT_OPTS[@]}" update || rc=$?
        if [ "$rc" -eq 124 ]; then
          echo "::error::apt-get update hit its ${UPDATE_TIMEOUT_MINUTES}-minute deadline - the mirror stalled; re-run this job once it recovers."
        fi
        if [ "$rc" -ne 0 ]; then exit "$rc"; fi

        # Resolve the install without fetching it, so the cache key can name
        # the exact .deb set this job is about to want. This reads the index
        # apt has just fetched and works out the plan; it took 3.58s on run
        # 39810991041. It has a deadline of its own so that a resolver which
        # stops making progress fails with this action's diagnostic rather
        # than being cancelled by the job cap.
        rc=0
        timeout --kill-after=30s "${RESOLVE_TIMEOUT_MINUTES}m" \
          apt-get "${APT_OPTS[@]}" install --print-uris -y $APT_PACKAGES > "$RUNNER_TEMP/apt-uris.txt" || rc=$?
        if [ "$rc" -eq 124 ]; then
          echo "::error::apt-get install --print-uris hit its ${RESOLVE_TIMEOUT_MINUTES}-minute deadline - the resolver stopped making progress."
        fi
        if [ "$rc" -ne 0 ]; then
          echo "::error::apt-get install --print-uris failed to resolve the package set."
          exit "$rc"
        fi
        node "$GITHUB_WORKSPACE/scripts/ci/apt-package-set-key.mjs" \
          --uris "$RUNNER_TEMP/apt-uris.txt" >> "$GITHUB_OUTPUT"

    - name: Restore the downloaded .deb set
      id: deb-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-apt-archives
        key: apt-debs-${{ runner.os }}-${{ steps.package-set.outputs.codename }}-${{ steps.package-set.outputs.digest }}
        restore-keys: |
          apt-debs-${{ runner.os }}-${{ steps.package-set.outputs.codename }}-

    - name: Install Linux system dependencies
      shell: bash
      env:
        INSTALL_TIMEOUT_MINUTES: ${{ inputs.install-timeout-minutes }}
      run: |
        APT_OPTS=(
          -o Acquire::Retries=5
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o Dir::Cache::archives="$GITHUB_WORKSPACE/.ci-apt-archives"
          -o APT::Sandbox::User=root
        )
        rc=0
        sudo timeout --kill-after=30s "${INSTALL_TIMEOUT_MINUTES}m" apt-get "${APT_OPTS[@]}" install -y \
          $APT_PACKAGES || rc=$?
        if [ "$rc" -eq 124 ]; then
          echo "::error::apt-get install hit its ${INSTALL_TIMEOUT_MINUTES}-minute deadline - downloads were still progressing too slowly; re-run this job."
        fi
        if [ "$rc" -ne 0 ]; then exit "$rc"; fi

        # actions/cache tars this directory as the unprivileged `runner` user,
        # but apt ran as root (see APT::Sandbox::User above) and left a root-only
        # `lock` file and a root-only `partial/` behind. tar then aborts with
        # "Cannot open: Permission denied", the save is skipped as a *warning*,
        # and the cache silently stays empty forever — measured on runs
        # 37478897554 and 37480484066. Drop both and open the .debs up for
        # reading so the job that runs first actually leaves an entry behind.
        rm -rf "$GITHUB_WORKSPACE/.ci-apt-archives/lock" "$GITHUB_WORKSPACE/.ci-apt-archives/partial"
        sudo chmod -R a+rX "$GITHUB_WORKSPACE/.ci-apt-archives"
        # Log the size: an empty line here means the cache saved nothing, which
        # is the symptom of a permissions problem rather than a slow mirror.
        echo "apt archive cache: $(du -sh "$GITHUB_WORKSPACE/.ci-apt-archives" | cut -f1)"

    # Written whenever the exact set is not already stored, so a package-set
    # change gets an entry of its own instead of leaving the cache frozen on
    # the set it happens to hold: the restore's exact-key hit is the only
    # case where the entry is already there. The release-scoped fallback
    # covers the rest, so a job whose resolution differs from the stored one
    # downloads the difference and stores its own set rather than leaving the
    # difference to be fetched again on every later run. That is best-effort:
    # when several jobs resolve the same set, one of them wins the cache
    # reservation and the rest skip the save.
    #
    # One entry is written per distinct resolution, not one per package-set
    # change: the resolutions diverge between jobs -- the runner pool mixes
    # image revisions, or the index moves between them -- and run 39807067624
    # wrote three entries of ~76 MB each.
    # The superseded ones are the least recently used, so they are the first
    # the repository's 10 GB cache budget evicts. A pull-request merge ref
    # cannot read another pull request's entry, so each Rust-touching pull
    # request leaves its own behind.
    #
    # Saved after the install rather than in a post-job step, so the entry is
    # there for the next job while this one is still compiling.
    - name: Save the downloaded .deb set
      if: steps.deb-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .ci-apt-archives
        key: apt-debs-${{ runner.os }}-${{ steps.package-set.outputs.codename }}-${{ steps.package-set.outputs.digest }}
