# Grouped dependency updates (issue #1541).
#
# Three ecosystems, one weekly Monday slot, and deliberately *grouped* rather
# than per-dependency: ungrouped npm produces dozens of single-bump pull
# requests a week, and on a repository where every pull request pays a
# frontend quality gate plus (for a Rust or workflow change) the Rust graph,
# that review cost is real. Grouping keeps the signal (one PR per ecosystem
# per week) while the gates keep the safety.
#
# `security-updates` is not configured here on purpose: Dependabot security
# updates are a *repository setting*, enabled independently of this file
# (`dependabot_security_updates` in the repository's security settings). They
# are separate from version updates precisely because they must not wait for a
# weekly batch.
#
# The Cargo ecosystem is listed at `/src-tauri` because that is where the
# manifest lives; Dependabot looks at the repository root by default and would
# find no `Cargo.toml` there. The workflows ecosystem keeps its own grouping: an action
# bump rewrites SHA pins, and a grouped action PR is reviewable as one change.
version: 2

updates:
  # The repository does not define the `dependencies` or `security` labels.
  # Leave label assignment out so Dependabot can open updates cleanly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      # Off the hour: the top of the hour is the busiest slot on GitHub's
      # scheduler, and this run is a background convenience, not a release gate.
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    ignore:
      # TypeScript's major line is gated on the lint toolchain, not on npm
      # (issue #2247). `typescript-eslint` publishes
      # `typescript: ">=4.8.4 <6.1.0"`, so a TypeScript 7 bump inside the
      # weekly batch made `npm ci` fail with ERESOLVE before tsc, ESLint, or
      # Vitest could run. The grouped bump also rewrote the manifest's own
      # `~5.8.3` pin to `~7.0.2`, so the range did not hold it back.
      # Lift this when typescript-eslint's declared peer range admits the
      # target TypeScript release.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      production-dependencies:
        dependency-type: production
      # Splitting runtime from toolchain once produced pull requests that
      # could not typecheck or build on their own, which is why the toolchain
      # is grouped at all. Dependency *type* was too coarse a key, though: the
      # previous `dependency-type: development` group swept TypeScript, ESLint,
      # Vite, and Vitest majors into one 19-update pull request (#2166) whose
      # `npm ci` failed with ERESOLVE. So the key is semver level first and
      # toolchain family second.
      #
      # Dependabot applies the first group a dependency matches, so the family
      # groups precede the catch-all.
      development-patches-minors:
        dependency-type: development
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
      # A major bump is a migration with its own peer and runtime fallout, so
      # it arrives alone for its own family rather than hidden in a batch.
      eslint-toolchain-majors:
        dependency-type: development
        update-types:
          - "version-update:semver-major"
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "globals"
      vite-toolchain-majors:
        dependency-type: development
        update-types:
          - "version-update:semver-major"
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
          - "autoprefixer"
      vitest-toolchain-majors:
        dependency-type: development
        update-types:
          - "version-update:semver-major"
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
          - "@playwright/test"
      development-majors:
        dependency-type: development
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates are the ones CI can absorb unattended. `cargo
      # update` moves the whole graph, so each group is still reviewed, but a
      # single PR instead of one per transitive bump.
      rust-patches:
        update-types:
          - patch
      rust-minors:
        update-types:
          - minor
      # Major bumps are the ones that change an API. They arrive alone so the
      # diff is the bump rather than a bump hidden in a batch.
      rust-majors:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # Every action in this repository is pinned to a full commit SHA (issue
      # #1541); Dependabot rewrites the SHA and updates the `# vX.Y.Z` comment
      # beside it, which is exactly the update workflow this repository wants.
      # Grouping keeps one PR to review rather than thirteen.
      github-actions:
        patterns:
          - "*"
