<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Single font request, preconnected; keep in sync with the --font-*
         stacks in src/App.css. Weight 800 is the wordmark lockup
         (src/components/TitleBar/Wordmark.tsx) and Tailwind's font-extrabold. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Brand icons. The SVG is the primary — it stays crisp at every DPI —
         with the PNG kept as the fallback for engines without SVG favicon
         support. Source: docs/brand/, regenerated by `npm run brand:build`. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/src/assets/logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buildmesh</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
